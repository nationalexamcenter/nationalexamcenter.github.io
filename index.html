        chapter_title: "খনিজ সম্পদ: জীবাশ্ম",
        topics: [{ id: "11.1", title: "জীবাশ্ম জ্বালানি ও পেট্রোলিয়াম", summary: ["• কয়লা, প্রাকৃতিক গ্যাস ও পেট্রোলিয়াম জীবাশ্ম জ্বালানি।", "• প্রাকৃতিক গ্যাসের প্রধান উপাদান মিথেন (CH₄)।", "• আংশিক পাতন পদ্ধতিতে পেট্রোলিয়াম পৃথক করা হয়।"], exam_questions: [] }]
    },
    12: {
        chapter_title: "আমাদের জীবনে রসায়ন",
        topics: [{ id: "12.1", title: "গৃহস্থালির রসায়ন", summary: ["• খাদ্যলবণ NaCl, ভিনেগার CH₃COOH এর দ্রবণ।", "• বেকিং সোডা NaHCO₃ কেক ফোলাতে ব্যবহৃত হয়।", "• কোমল পানীয়তে CO₂ দ্রবীভূত থাকে।"], exam_questions: [] }]
    }
};

// State
let completedChapters = JSON.parse(localStorage.getItem('chemistry_completed_chapters') || '[]');
let currentChapterId = null;
let currentTopicIndex = 0;

function updateOverallProgress() {
    const percent = Math.round((completedChapters.length / 12) * 100);
    document.getElementById('overallProgress').innerText = percent + '%';
    document.getElementById('mainProgressBar').style.width = percent + '%';
    document.getElementById('completedChaptersCount').innerText = completedChapters.length;
    localStorage.setItem('chemistry_completed_chapters', JSON.stringify(completedChapters));
}

function isChapterCompleted(chapterId) { return completedChapters.includes(chapterId); }

function markChapterComplete(chapterId) {
    if (!completedChapters.includes(chapterId)) {
        completedChapters.push(chapterId);
        updateOverallProgress();
        renderChaptersGrid();
        if (currentChapterId === chapterId) {
            const btn = document.getElementById('markChapterCompleteBtn');
            btn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> সম্পূর্ণ!';
            btn.classList.remove('bg-green-500/20', 'border-green-500/50', 'text-green-400');
            btn.classList.add('bg-gray-700', 'text-gray-400');
        }
        showToast('🎉 অধ্যায় সম্পূর্ণ চিহ্নিত করা হয়েছে!', 'success');
    }
}

function showToast(msg, type) {
    const toast = document.createElement('div');
    toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-lg text-sm z-50 animate-bounce ${type === 'success' ? 'bg-green-600' : 'bg-blue-600'} text-white`;
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

function renderChaptersGrid() {
    const container = document.getElementById('chaptersGrid');
    container.innerHTML = CHAPTERS_META.map(ch => `
        <div class="glass-card rounded-2xl p-6 chapter-card" data-chapter-id="${ch.id}">
            <div class="flex justify-between items-start mb-3">
                <span class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full">অধ্যায় ${ch.id}</span>
                ${isChapterCompleted(ch.id) ? '<i class="fas fa-check-circle text-green-500 text-xl"></i>' : ''}
            </div>
            <h3 class="text-xl font-bold mb-1">${ch.title}</h3>
            <p class="text-gray-400 text-sm mb-4">${ch.title_en}</p>
            <button class="view-chapter-btn px-4 py-2 rounded-lg bg-amber-500/20 text-amber-400 text-sm hover:bg-amber-500/30 transition" data-chapter-id="${ch.id}">
                <i class="fas fa-book-open mr-1"></i> পড়ুন
            </button>
        </div>
    `).join('');
    
    document.querySelectorAll('.view-chapter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openChapter(parseInt(btn.dataset.chapterId));
        });
    });
    document.querySelectorAll('.chapter-card').forEach(card => {
        card.addEventListener('click', () => openChapter(parseInt(card.dataset.chapterId)));
    });
}

function openChapter(chapterId) {
    currentChapterId = chapterId;
    const data = CHAPTER_CONTENT[chapterId];
    
    document.getElementById('chaptersView').classList.add('hidden');
    document.getElementById('chapterView').classList.remove('hidden');
    document.getElementById('chapterNumber').innerText = chapterId;
    document.getElementById('chapterTitle').innerHTML = data.chapter_title;
    
    const markBtn = document.getElementById('markChapterCompleteBtn');
    if (isChapterCompleted(chapterId)) {
        markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> সম্পূর্ণ!';
        markBtn.classList.remove('bg-green-500/20', 'border-green-500/50', 'text-green-400');
        markBtn.classList.add('bg-gray-700', 'text-gray-400');
    } else {
        markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> অধ্যায় সম্পূর্ণ চিহ্নিত করুন';
        markBtn.classList.remove('bg-gray-700', 'text-gray-400');
        markBtn.classList.add('bg-green-500/20', 'border-green-500/50', 'text-green-400');
    }
    
    const tabsContainer = document.getElementById('topicsTabs');
    tabsContainer.innerHTML = data.topics.map((t, idx) => `
        <button class="topic-tab px-4 py-2 rounded-lg text-sm transition ${idx === 0 ? 'bg-amber-500/20 text-amber-400' : 'text-gray-400 hover:text-amber-400'}" data-topic-index="${idx}">${t.id} ${t.title.substring(0, 25)}...</button>
    `).join('');
    
    currentTopicIndex = 0;
    loadTopicContent(chapterId, 0);
    
    document.querySelectorAll('.topic-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const idx = parseInt(tab.dataset.topicIndex);
            currentTopicIndex = idx;
            loadTopicContent(chapterId, idx);
            document.querySelectorAll('.topic-tab').forEach(t => t.classList.remove('bg-amber-500/20', 'text-amber-400'));
            tab.classList.add('bg-amber-500/20', 'text-amber-400');
        });
    });
}

function loadTopicContent(chapterId, topicIndex) {
    const topic = CHAPTER_CONTENT[chapterId].topics[topicIndex];
    const container = document.getElementById('topicContent');
    const examQuestions = topic.exam_questions || [];
    
    let html = `
        <div>
            <div class="flex items-center gap-2 mb-4">
                <i class="fas fa-book text-amber-400"></i>
                <span class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full">টপিক ${topic.id}</span>
            </div>
            <h2 class="text-2xl font-bold mb-6">${topic.title}</h2>
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-align-left mr-2"></i>সারাংশ</h3>
                <div class="space-y-2 bg-black/20 rounded-xl p-4">
                    ${topic.summary.map(s => `<p class="text-gray-300 leading-relaxed">${s}</p>`).join('')}
                </div>
            </div>
    `;
    
    if (examQuestions.length > 0) {
        html += `
            <div class="mt-8 pt-6 border-t border-white/10">
                <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-question-circle mr-2"></i>MCQ পরীক্ষা</h3>
                <div id="mcqContainer" class="space-y-4">
                    ${examQuestions.map((mcq, idx) => `
                        <div class="glass rounded-xl p-4" data-mcq-idx="${idx}">
                            <p class="font-medium mb-3">${idx+1}. ${mcq.q}</p>
                            <div class="grid gap-2">
                                ${mcq.o.map((opt, optIdx) => `
                                    <div class="mcq-option glass border border-white/10 rounded-lg p-2 px-3 text-sm transition" data-opt-idx="${optIdx}" data-correct="${optIdx === mcq.a}">
                                        <span class="mr-2">${String.fromCharCode(65+optIdx)}.</span> ${opt}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
                <button class="check-mcq-btn mt-4 px-4 py-2 rounded-lg bg-amber-500/20 border border-amber-500/50 text-amber-400 text-sm hover:bg-amber-500/30 transition">
                    <i class="fas fa-check-double mr-1"></i> উত্তর যাচাই করুন
                </button>
            </div>
        `;
    }
    
    container.innerHTML = html;
    
    setTimeout(() => {
        const mcqContainer = document.getElementById('mcqContainer');
        if (mcqContainer) {
            mcqContainer.querySelectorAll('.mcq-option').forEach(opt => {
                opt.onclick = function() {
                    this.closest('.glass').querySelectorAll('.mcq-option').forEach(o => o.classList.remove('selected', 'correct', 'wrong'));
                    this.classList.add('selected');
                };
            });
            const checkBtn = document.querySelector('.check-mcq-btn');
            if (checkBtn) {
                checkBtn.onclick = () => {
                    let score = 0, total = 0;
                    document.querySelectorAll('[data-mcq-idx]').forEach(q => {
                        const opts = q.querySelectorAll('.mcq-option');
                        let selected = null, correct = null;
                        opts.forEach((o, i) => {
                            if (o.classList.contains('selected')) selected = i;
                            if (o.dataset.correct === 'true') correct = i;
                        });
                        if (selected !== null) total++;
                        if (selected === correct) score++;
                        opts.forEach((o, i) => {
                            o.classList.remove('selected');
                            if (i === correct) o.classList.add('correct');
                            if (selected === i && selected !== correct) o.classList.add('wrong');
                        });
                    });
                    showToast(`📊 স্কোর: ${score}/${total}`, score === total ? 'success' : 'info');
                };
            }
        }
    }, 100);
}

function init() {
    renderChaptersGrid();
    updateOverallProgress();
    document.getElementById('homeBtn').addEventListener('click', () => {
        document.getElementById('chaptersView').classList.remove('hidden');
        document.getElementById('chapterView').classList.add('hidden');
    });
    document.getElementById('backToChaptersBtn').addEventListener('click', () => {
        document.getElementById('chaptersView').classList.remove('hidden');
        document.getElementById('chapterView').classList.add('hidden');
    });
    document.getElementById('markChapterCompleteBtn').addEventListener('click', () => {
        if (currentChapterId) markChapterComplete(currentChapterId);
    });
}

init();
</script>
</body>
</html>
