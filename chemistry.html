<script>
// ============================================
// SIMPLE WORKING CHEMISTRY APP - NO FIREBASE
// ============================================

const CHAPTERS_META = [
    { id: 1, title: "রসায়নের ধারণা", title_en: "The Concepts of Chemistry" },
    { id: 2, title: "পদার্থের অবস্থা", title_en: "States of Matter" },
    { id: 3, title: "পদার্থের গঠন", title_en: "Structure of Matter" },
    { id: 4, title: "পর্যায় সারণি", title_en: "Periodic Table" },
    { id: 5, title: "রাসায়নিক বন্ধন", title_en: "Chemical Bond" },
    { id: 6, title: "মোলের ধারণা ও রাসায়নিক গণনা", title_en: "Mole Concept" },
    { id: 7, title: "রাসায়নিক বিক্রিয়া", title_en: "Chemical Reactions" },
    { id: 8, title: "রসায়ন ও শক্তি", title_en: "Chemistry and Energy" },
    { id: 9, title: "এসিড-ক্ষারক সমতা", title_en: "Acid-Base Equilibrium" },
    { id: 10, title: "খনিজ সম্পদ: ধাতু-অধাতু", title_en: "Mineral Resources" },
    { id: 11, title: "খনিজ সম্পদ: জীবাশ্ম", title_en: "Fossil Fuels" },
    { id: 12, title: "আমাদের জীবনে রসায়ন", title_en: "Chemistry in Our Life" }
];

let completedChapters = [];
try {
    const stored = localStorage.getItem('chemistry_completed_chapters');
    if (stored) completedChapters = JSON.parse(stored);
} catch(e) { completedChapters = []; }

let currentChapterId = null;
let currentTopicIndex = 0;
let chapterDataCache = {};
let activeExamTimer = null;
let isExamInProgress = false;

function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 px-5 py-3 rounded-xl text-sm z-50 shadow-xl font-medium ${type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'} text-white`;
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function getBengaliLetter(key) {
    const letters = { 'ka': 'ক', 'kha': 'খ', 'ga': 'গ', 'gha': 'ঘ' };
    return letters[key] || key.toUpperCase();
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function normalizeQuestion(question, idx) {
    if (!question.o || !Array.isArray(question.o)) return question;
    let correctIndex = -1;
    if (typeof question.a === 'number') correctIndex = question.a;
    else if (typeof question.a === 'string') {
        const answerText = question.a.trim();
        correctIndex = question.o.findIndex(opt => opt.trim() === answerText);
        if (correctIndex === -1) correctIndex = 0;
    } else correctIndex = 0;
    return { q: question.q, o: [...question.o], a: correctIndex };
}

async function loadChapter(chapterId) {
    if (chapterDataCache[chapterId]) return chapterDataCache[chapterId];
    try {
        const response = await fetch(`data/chapter-${chapterId}.json`);
        if (!response.ok) throw new Error(`Chapter ${chapterId} not found`);
        const data = await response.json();
        if (data.topics && data.topics.length) {
            data.topics.forEach(topic => {
                if (topic.exam && topic.exam.questions) {
                    topic.exam.questions = topic.exam.questions.map((q, idx) => normalizeQuestion(q, idx));
                }
            });
        }
        chapterDataCache[chapterId] = data;
        console.log(`✅ Chapter ${chapterId} loaded from JSON`);
        return data;
    } catch (error) {
        console.warn(`⚠️ Could not load chapter ${chapterId} JSON, using fallback`);
        return {
            chapter_title: CHAPTERS_META.find(c => c.id === chapterId)?.title || `অধ্যায় ${chapterId}`,
            topics: [{
                id: `${chapterId}.1`,
                title: `${CHAPTERS_META.find(c => c.id === chapterId)?.title} - সম্পূর্ণ প্রস্তুতি`,
                study: { summary: [`• ${CHAPTERS_META.find(c => c.id === chapterId)?.title} অধ্যায়ের বিস্তারিত ব্যাখ্যা।`] },
                exam: { questions: [
                    { q: `${CHAPTERS_META.find(c => c.id === chapterId)?.title} অধ্যায়ের মূল বিষয় কী?`, o: ["পারমাণবিক গঠন", "রাসায়নিক বন্ধন", "মৌলের পর্যায়বৃত্ত ধর্ম", "তাপগতি"], a: 1 }
                ] }
            }]
        };
    }
}

function updateOverallProgress() {
    const percent = Math.round((completedChapters.length / 12) * 100);
    const progressBar = document.getElementById('mainProgressBar');
    const completedSpan = document.getElementById('completedChaptersCount');
    if (progressBar) progressBar.style.width = percent + '%';
    if (completedSpan) completedSpan.innerText = completedChapters.length;
    document.getElementById('totalChaptersCount').innerText = 12;
    localStorage.setItem('chemistry_completed_chapters', JSON.stringify(completedChapters));
}

function markChapterComplete(chapterId) {
    if (!completedChapters.includes(chapterId)) {
        completedChapters.push(chapterId);
        updateOverallProgress();
        renderChaptersGrid();
        if (currentChapterId === chapterId) {
            const btn = document.getElementById('markChapterCompleteBtn');
            if (btn) {
                btn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> সম্পূর্ণ!';
                btn.classList.remove('bg-green-500/20', 'border-green-500/50', 'text-green-400');
                btn.classList.add('bg-gray-700', 'text-gray-400');
            }
        }
        showToast('🎉 অধ্যায় সম্পূর্ণ চিহ্নিত করা হয়েছে!', 'success');
    }
}

function renderChaptersGrid() {
    const container = document.getElementById('chaptersGrid');
    if (!container) return;
    
    console.log('Rendering chapters grid...');
    container.innerHTML = CHAPTERS_META.map(ch => `
        <div class="glass-card rounded-2xl p-6">
            <div class="flex justify-between items-start mb-3">
                <span class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full">অধ্যায় ${ch.id}</span>
                ${completedChapters.includes(ch.id) ? '<i class="fas fa-check-circle text-green-500 text-xl"></i>' : ''}
            </div>
            <h3 class="text-xl font-bold mb-1">${ch.title}</h3>
            <p class="text-gray-400 text-sm mb-4">${ch.title_en}</p>
            <button onclick="window.openChapter(${ch.id})" class="w-full px-4 py-2 rounded-lg bg-amber-500/20 text-amber-400 text-sm hover:bg-amber-500/30 transition">
                <i class="fas fa-book-open mr-1"></i> পড়ুন ও পরীক্ষা দিন
            </button>
        </div>
    `).join('');
    console.log('Chapters grid rendered');
}

async function openChapter(chapterId) {
    console.log(`Opening chapter ${chapterId}...`);
    if (activeExamTimer) { clearInterval(activeExamTimer); activeExamTimer = null; }
    isExamInProgress = false;
    currentChapterId = chapterId;
    const chapterData = await loadChapter(chapterId);
    
    document.getElementById('chaptersView').classList.add('hidden');
    document.getElementById('chapterView').classList.remove('hidden');
    document.getElementById('chapterNumber').innerText = chapterId;
    document.getElementById('chapterTitle').innerHTML = chapterData.chapter_title;
    
    const markBtn = document.getElementById('markChapterCompleteBtn');
    if (completedChapters.includes(chapterId)) {
        markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> সম্পূর্ণ!';
        markBtn.classList.remove('bg-green-500/20', 'border-green-500/50', 'text-green-400');
        markBtn.classList.add('bg-gray-700', 'text-gray-400');
    } else {
        markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> অধ্যায় সম্পূর্ণ চিহ্নিত করুন';
        markBtn.classList.remove('bg-gray-700', 'text-gray-400');
        markBtn.classList.add('bg-green-500/20', 'border-green-500/50', 'text-green-400');
    }
    
    const tabsContainer = document.getElementById('topicsTabs');
    tabsContainer.innerHTML = chapterData.topics.map((topic, idx) => `
        <button class="topic-tab px-4 py-2 rounded-lg text-sm transition ${idx === 0 ? 'bg-amber-500/20 text-amber-400' : 'text-gray-400 hover:text-amber-400'}" data-topic-index="${idx}">
            <i class="fas fa-layer-group mr-1"></i> ${topic.id}
        </button>
    `).join('');
    
    currentTopicIndex = 0;
    await loadTopicContent(chapterId, 0, chapterData);
    
    document.querySelectorAll('.topic-tab').forEach(tab => {
        tab.addEventListener('click', async () => {
            if (isExamInProgress && !confirm('⚠️ পরীক্ষা চলছে। টপিক পরিবর্তন করলে আপনার উত্তর হারাবে।')) return;
            if (activeExamTimer) { clearInterval(activeExamTimer); activeExamTimer = null; }
            isExamInProgress = false;
            const idx = parseInt(tab.dataset.topicIndex);
            currentTopicIndex = idx;
            await loadTopicContent(chapterId, idx, chapterData);
            document.querySelectorAll('.topic-tab').forEach(t => {
                t.classList.remove('bg-amber-500/20', 'text-amber-400');
                t.classList.add('text-gray-400');
            });
            tab.classList.add('bg-amber-500/20', 'text-amber-400');
        });
    });
}

async function loadTopicContent(chapterId, topicIndex, chapterData) {
    if (activeExamTimer) { clearInterval(activeExamTimer); activeExamTimer = null; }
    isExamInProgress = false;
    const topic = chapterData.topics[topicIndex];
    const container = document.getElementById('topicContent');
    const study = topic.study || {};
    const summary = study.summary || [`${topic.title} - বিস্তারিত কন্টেন্ট`];
    const creativeQuestions = study.creative_questions || [];
    let examQuestions = (topic.exam && topic.exam.questions) ? [...topic.exam.questions] : [];
    
    let html = `<div><h2 class="text-2xl font-bold mb-6">${topic.title}</h2><div class="mb-6"><h3 class="text-lg font-semibold text-amber-400 mb-3">সারাংশ</h3><div class="space-y-2 bg-black/20 rounded-xl p-4">${summary.map(s => `<p class="text-gray-300">${s}</p>`).join('')}</div></div>`;
    
    if (creativeQuestions.length > 0) {
        html += `<div class="mb-6"><h3 class="text-lg font-semibold text-amber-400 mb-3">সৃজনশীল প্রশ্ন</h3>${creativeQuestions.map((cq, idx) => `<div class="border border-white/10 rounded-xl p-3 mb-3"><p><strong>উদ্দীপক:</strong> ${cq.paragraph || ''}</p>${Object.entries(cq.sub_questions || {}).map(([key, val]) => `<div class="mt-2"><p class="text-amber-400">${getBengaliLetter(key)}) ${val.question || ''}</p><p class="text-green-400">উত্তর: ${val.answer || ''}</p></div>`).join('')}</div>`).join('')}</div>`;
    }
    
    if (examQuestions.length > 0) {
        html += `<div class="mt-8 pt-6 border-t border-white/10"><div class="instruction-box rounded-xl p-4 mb-6"><p class="text-sm text-blue-300"><strong>MCQ পরীক্ষা</strong> - মোট ${examQuestions.length}টি প্রশ্ন</p></div><div class="exam-header flex flex-wrap justify-between items-center gap-4 mb-6 bg-gray-800/50 rounded-xl p-4"><div><h3 class="text-xl font-bold text-amber-400">MCQ পরীক্ষা</h3></div><div class="flex items-center gap-4"><div id="examTimer" class="text-lg font-mono font-bold text-amber-400 bg-black/50 px-4 py-2 rounded-full">⏱️ 0:00</div><button id="startExamBtn" class="px-6 py-2 rounded-xl bg-gradient-to-r from-amber-600 to-orange-600 text-white font-bold">পরীক্ষা শুরু করুন</button></div></div><div id="mcqExamPanel" style="display: none;"><div id="mcqQuestionsContainer" class="space-y-5 mb-6"></div><div class="flex gap-4 mt-6"><button id="submitMcqBtn" class="px-6 py-3 rounded-xl bg-green-600 text-white font-bold">উত্তর জমা দিন</button><button id="resetMcqBtn" class="px-6 py-3 rounded-xl bg-gray-700 text-white font-bold">রিসেট করুন</button></div></div><div id="mcqResultPanel" class="result-card rounded-xl p-5 mt-6 hidden"></div></div>`;
        container.innerHTML = html;
        
        let mcqState = { questions: [], userAnswers: [], examStarted: false, examEnded: false, timerInterval: null, timeRemaining: 0 };
        const TIME_PER_QUESTION = 60;
        
        function shuffleQuestions() {
            mcqState.questions = examQuestions.map((originalQ, idx) => {
                const originalOptions = [...originalQ.o];
                let correctIndex = typeof originalQ.a === 'number' ? originalQ.a : 0;
                const indexedOptions = originalOptions.map((text, i) => ({ text, originalIndex: i }));
                const shuffledIndexed = shuffleArray([...indexedOptions]);
                const shuffledOptions = shuffledIndexed.map(item => item.text);
                const newCorrectIndex = shuffledIndexed.findIndex(item => item.originalIndex === correctIndex);
                return { id: idx, text: originalQ.q, options: shuffledOptions, correctIndex: newCorrectIndex !== -1 ? newCorrectIndex : 0 };
            });
            mcqState.userAnswers = new Array(mcqState.questions.length).fill(null);
        }
        
        function renderQuestions() {
            const containerDiv = document.getElementById('mcqQuestionsContainer');
            if (!containerDiv) return;
            containerDiv.innerHTML = mcqState.questions.map((q, qIdx) => `<div class="glass rounded-xl p-4 border border-white/10" data-qidx="${qIdx}"><p class="font-semibold mb-3"><span class="text-amber-400">${qIdx+1}.</span> ${q.text}</p><div class="grid gap-2 ml-2">${q.options.map((opt, optIdx) => `<div class="mcq-option flex items-center gap-3 p-2 px-4 rounded-lg" data-qidx="${qIdx}" data-optidx="${optIdx}"><span class="w-6 h-6 rounded-full border border-amber-500/50 flex items-center justify-center text-xs font-bold">${String.fromCharCode(65+optIdx)}</span><span>${opt}</span></div>`).join('')}</div></div>`).join('');
            document.querySelectorAll('.mcq-option').forEach(opt => { opt.addEventListener('click', () => { if (mcqState.examEnded || !mcqState.examStarted) return; const qIdx = parseInt(opt.dataset.qidx); const selectedIdx = parseInt(opt.dataset.optidx); mcqState.userAnswers[qIdx] = (mcqState.userAnswers[qIdx] === selectedIdx) ? null : selectedIdx; document.querySelectorAll(`.mcq-option[data-qidx="${qIdx}"]`).forEach(option => { const optIdx = parseInt(option.dataset.optidx); if (optIdx === mcqState.userAnswers[qIdx]) option.classList.add('selected'); else option.classList.remove('selected'); }); }); });
        }
        
        function stopTimer() { if (mcqState.timerInterval) { clearInterval(mcqState.timerInterval); mcqState.timerInterval = null; } if (activeExamTimer) { clearInterval(activeExamTimer); activeExamTimer = null; } }
        function updateTimerDisplay() { const minutes = Math.floor(mcqState.timeRemaining / 60); const seconds = mcqState.timeRemaining % 60; const timerElement = document.getElementById('examTimer'); if (timerElement) timerElement.innerHTML = `⏱️ ${minutes}:${seconds.toString().padStart(2, '0')}`; }
        function startTimer() { stopTimer(); mcqState.timeRemaining = mcqState.questions.length * TIME_PER_QUESTION; updateTimerDisplay(); mcqState.timerInterval = setInterval(() => { if (mcqState.timeRemaining > 0 && mcqState.examStarted && !mcqState.examEnded) { mcqState.timeRemaining--; updateTimerDisplay(); if (mcqState.timeRemaining === 0) { stopTimer(); calculateAndShowResult(); } } }, 1000); activeExamTimer = mcqState.timerInterval; }
        function calculateAndShowResult() { if (mcqState.examEnded) return; stopTimer(); mcqState.examEnded = true; isExamInProgress = false; let correct = 0; for (let i = 0; i < mcqState.questions.length; i++) if (mcqState.userAnswers[i] !== null && mcqState.userAnswers[i] === mcqState.questions[i].correctIndex) correct++; const resultPanel = document.getElementById('mcqResultPanel'); resultPanel.innerHTML = `<div class="text-center"><h4 class="text-2xl font-bold">আপনার ফলাফল</h4><div class="text-4xl font-bold text-amber-400 my-3">${correct}/${mcqState.questions.length}</div><button id="resetAfterResult" class="px-4 py-2 rounded-lg bg-blue-500 text-white">আবার চেষ্টা করুন</button></div>`; resultPanel.classList.remove('hidden'); document.getElementById('resetAfterResult')?.addEventListener('click', () => resetExam()); showToast(`স্কোর: ${correct}/${mcqState.questions.length}`, 'success'); }
        function resetExam() { stopTimer(); mcqState.examStarted = false; mcqState.examEnded = false; isExamInProgress = false; mcqState.userAnswers.fill(null); const examPanel = document.getElementById('mcqExamPanel'); const startBtn = document.getElementById('startExamBtn'); const resultPanel = document.getElementById('mcqResultPanel'); if (examPanel) examPanel.style.display = 'none'; if (resultPanel) { resultPanel.classList.add('hidden'); resultPanel.innerHTML = ''; } if (startBtn) { startBtn.disabled = false; startBtn.innerHTML = 'পরীক্ষা শুরু করুন'; } renderQuestions(); }
        
        const startBtn = document.getElementById('startExamBtn');
        const examPanel = document.getElementById('mcqExamPanel');
        const submitBtn = document.getElementById('submitMcqBtn');
        const resetBtn = document.getElementById('resetMcqBtn');
        
        if (startBtn) startBtn.onclick = () => { shuffleQuestions(); mcqState.examStarted = true; isExamInProgress = true; if (examPanel) examPanel.style.display = 'block'; startBtn.disabled = true; startBtn.innerHTML = 'পরীক্ষা শুরু হয়েছে'; renderQuestions(); startTimer(); showToast('পরীক্ষা শুরু হয়েছে!', 'success'); };
        if (submitBtn) submitBtn.onclick = () => { if (!mcqState.examStarted) { showToast('পরীক্ষা শুরু হয়নি!', 'error'); return; } calculateAndShowResult(); };
        if (resetBtn) resetBtn.onclick = () => resetExam();
    } else { container.innerHTML = html + '<div class="text-center text-gray-400 py-8"><p>MCQ পরীক্ষা শীঘ্রই যুক্ত হবে।</p></div>'; }
    
    setTimeout(() => { document.querySelectorAll('.sq-toggle, .cq-toggle, .math-toggle').forEach(btn => { btn.addEventListener('click', () => { const answer = btn.nextElementSibling; const icon = btn.querySelector('.fa-chevron-down'); if (answer) { answer.classList.toggle('hidden'); if (icon) icon.style.transform = answer.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)'; } }); }); }, 100);
}

// Initialize everything
document.addEventListener('DOMContentLoaded', () => {
    console.log('DOM loaded, rendering chapters...');
    renderChaptersGrid();
    updateOverallProgress();
    
    const backBtn = document.getElementById('backToChaptersBtn');
    if (backBtn) {
        backBtn.onclick = () => {
            if (isExamInProgress && !confirm('পরীক্ষা চলছে। ফিরে যেতে চান?')) return;
            if (activeExamTimer) clearInterval(activeExamTimer);
            isExamInProgress = false;
            document.getElementById('chaptersView').classList.remove('hidden');
            document.getElementById('chapterView').classList.add('hidden');
            currentChapterId = null;
        };
    }
    
    const markBtn = document.getElementById('markChapterCompleteBtn');
    if (markBtn) {
        markBtn.onclick = () => { if (currentChapterId) markChapterComplete(currentChapterId); };
    }
});

// Make openChapter globally available
window.openChapter = openChapter;
console.log('Script loaded, openChapter function attached to window');
</script>
