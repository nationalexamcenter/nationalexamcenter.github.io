<script>

const CHAPTERS_META = [

    { id: 9, title: "এসিড-ক্ষারক সমতা", title_en: "Acid-Base Equilibrium" },

let completedChapters = [];
try {
    const stored = localStorage.getItem('chemistry_completed_chapters');
    if (stored) completedChapters = JSON.parse(stored);
} catch(e) { completedChapters = []; }

let currentChapterId = null;
let currentTopicIndex = 0;
let chapterDataCache = {};

function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 px-5 py-3 rounded-xl text-sm z-50 shadow-xl font-medium ${
        type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'
    } text-white`;
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function getBengaliLetter(key) {
    const letters = { 'ka': 'ক', 'kha': 'খ', 'ga': 'গ', 'gha': 'ঘ' };
    return letters[key] || key.toUpperCase();
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// Normalize question: convert answer (string or number) to index
function normalizeQuestion(question, idx) {
    if (!question.o || !Array.isArray(question.o)) {
        console.error(`Question ${idx} has invalid options`, question);
        return question;
    }
    const options = question.o;
    let correctIndex = -1;
    
    if (typeof question.a === 'number') {
        correctIndex = question.a;
        if (correctIndex < 0 || correctIndex >= options.length) {
            console.error(`Question ${idx}: index ${correctIndex} out of range, default 0`);
            correctIndex = 0;
        }
    } else if (typeof question.a === 'string') {
        const answerText = question.a.trim();
        correctIndex = options.findIndex(opt => opt.trim() === answerText);
        if (correctIndex === -1) {
            console.error(`Question ${idx}: answer "${answerText}" not found, default 0`);
            correctIndex = 0;
        }
    } else {
        console.error(`Question ${idx}: invalid 'a' type, default 0`);
        correctIndex = 0;
    }
    
    return {
        q: question.q,
        o: [...options],
        a: correctIndex
    };
}

async function loadChapter(chapterId) {
    if (chapterDataCache[chapterId]) return chapterDataCache[chapterId];
    
    try {
        const response = await fetch(`data/chapter-${chapterId}.json`);
        if (!response.ok) throw new Error(`Chapter ${chapterId} not found`);
        const data = await response.json();
        
        // Normalize all MCQ questions
        if (data.topics && data.topics.length) {
            data.topics.forEach(topic => {
                if (topic.exam && topic.exam.questions) {
                    topic.exam.questions = topic.exam.questions.map((q, idx) => normalizeQuestion(q, idx));
                }
            });
        }
        
        chapterDataCache[chapterId] = data;
        return data;
    } catch (error) {
        console.error(`Error loading chapter ${chapterId}:`, error);
        // Fallback data with normalized answers
        const fallbackMCQ = [
            { q: `${CHAPTERS_META.find(c => c.id === chapterId)?.title} অধ্যায়ের মূল বিষয় কী?`, o: ["পারমাণবিক গঠন", "রাসায়নিক বন্ধন", "মৌলের পর্যায়বৃত্ত ধর্ম", "তাপগতি"], a: 1 },
            { q: "রসায়নের জনক কে?", o: ["আইজ্যাক নিউটন", "অ্যান্টনি ল্যাভয়সিয়ে", "আল-বেরুনি", "জাবির ইবনে হাইয়ান"], a: 3 },
            { q: "মোলার ভরের একক কী?", o: ["গ্রাম", "মোল", "গ্রাম/মোল", "কেজি/মোল"], a: 2 }
        ];
        return {
            chapter_title: CHAPTERS_META.find(c => c.id === chapterId)?.title || `অধ্যায় ${chapterId}`,
            topics: [{
                id: `${chapterId}.1`,
                title: `${CHAPTERS_META.find(c => c.id === chapterId)?.title || `অধ্যায় ${chapterId}`} - সম্পূর্ণ প্রস্তুতি`,
                study: { 
                    summary: [`• ${CHAPTERS_META.find(c => c.id === chapterId)?.title} অধ্যায়ের বিস্তারিত ব্যাখ্যা।`, '• এনসিটিবি ২০২৬ সিলেবাস অনুযায়ী।']
                },
                exam: { questions: fallbackMCQ }
            }]
        };
    }
}

function updateOverallProgress() {
    const percent = Math.round((completedChapters.length / 12) * 100);
    const progressSpan = document.getElementById('overallProgress');
    const progressBar = document.getElementById('mainProgressBar');
    const completedSpan = document.getElementById('completedChaptersCount');

    if (progressBar) progressBar.style.width = percent + '%';
    if (completedSpan) completedSpan.innerText = completedChapters.length;
    document.getElementById('totalChaptersCount').innerText = 12;
    localStorage.setItem('chemistry_completed_chapters', JSON.stringify(completedChapters));
}

function markChapterComplete(chapterId) {
    if (!completedChapters.includes(chapterId)) {
        completedChapters.push(chapterId);
        updateOverallProgress();
        renderChaptersGrid();
        if (currentChapterId === chapterId) {
            const btn = document.getElementById('markChapterCompleteBtn');
            if (btn) {
                btn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> সম্পূর্ণ!';
                btn.classList.remove('bg-green-500/20', 'border-green-500/50', 'text-green-400');
                btn.classList.add('bg-gray-700', 'text-gray-400');
            }
        }
        showToast('🎉 অধ্যায় সম্পূর্ণ চিহ্নিত করা হয়েছে!', 'success');
    }
}

function renderChaptersGrid() {
    const container = document.getElementById('chaptersGrid');
    if (!container) return;
    
    container.innerHTML = CHAPTERS_META.map(ch => `
        <div class="glass-card rounded-2xl p-6 chapter-card">
            <div class="flex justify-between items-start mb-3">
                <span class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full">অধ্যায় ${ch.id}</span>

            </div>
            <h3 class="text-xl font-bold mb-1">${ch.title}</h3>
            <p class="text-gray-400 text-sm mb-4">${ch.title_en}</p>
            <button onclick="openChapter(${ch.id})" class="w-full px-4 py-2 rounded-lg bg-amber-500/20 text-amber-400 text-sm hover:bg-amber-500/30 transition">
                <i class="fas fa-book-open mr-1"></i> পড়ুন ও পরীক্ষা দিন
            </button>
        </div>
    `).join('');
}

async function openChapter(chapterId) {
    currentChapterId = chapterId;
    const chapterData = await loadChapter(chapterId);
    
    document.getElementById('chaptersView').classList.add('hidden');
    document.getElementById('chapterView').classList.remove('hidden');
    document.getElementById('chapterNumber').innerText = chapterId;
    document.getElementById('chapterTitle').innerHTML = chapterData.chapter_title;
    
    const markBtn = document.getElementById('markChapterCompleteBtn');
    if (completedChapters.includes(chapterId)) {
        markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> সম্পূর্ণ!';
        markBtn.classList.remove('bg-green-500/20', 'border-green-500/50', 'text-green-400');
        markBtn.classList.add('bg-gray-700', 'text-gray-400');
    } else {
        markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> অধ্যায় সম্পূর্ণ চিহ্নিত করুন';
        markBtn.classList.remove('bg-gray-700', 'text-gray-400');
        markBtn.classList.add('bg-green-500/20', 'border-green-500/50', 'text-green-400');
    }
    
    const tabsContainer = document.getElementById('topicsTabs');
    tabsContainer.innerHTML = chapterData.topics.map((topic, idx) => `
        <button class="topic-tab px-4 py-2 rounded-lg text-sm transition ${idx === 0 ? 'bg-amber-500/20 text-amber-400' : 'text-gray-400 hover:text-amber-400'}" data-topic-index="${idx}">

        </button>
    `).join('');
    
    currentTopicIndex = 0;
    await loadTopicContent(chapterId, 0, chapterData);
    
    document.querySelectorAll('.topic-tab').forEach(tab => {
        tab.addEventListener('click', async () => {
            const idx = parseInt(tab.dataset.topicIndex);
            currentTopicIndex = idx;
            await loadTopicContent(chapterId, idx, chapterData);
            document.querySelectorAll('.topic-tab').forEach(t => {
                t.classList.remove('bg-amber-500/20', 'text-amber-400');
                t.classList.add('text-gray-400');
            });
            tab.classList.add('bg-amber-500/20', 'text-amber-400');
        });
    });
}

    // Creative Questions
    if (creativeQuestions.length > 0) {
        html += `<div class="mb-6"><h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-pencil-alt mr-2"></i>সৃজনশীল প্রশ্ন</h3><div class="space-y-4">${creativeQuestions.map((cq, idx) => `<div class="border border-white/10 rounded-xl overflow-hidden"><button class="cq-toggle w-full text-left hover:bg-white/5 transition flex justify-between items-center p-3 font-medium"><span>${idx+1}. ${(cq.paragraph || '').substring(0, 100)}...</span><i class="fas fa-chevron-down text-gray-500"></i></button><div class="cq-answer hidden border-t border-white/10 p-3"><div class="creative-paragraph mb-3"><strong>উদ্দীপক:</strong> ${cq.paragraph || ''}</div>${Object.entries(cq.sub_questions || {}).map(([key, val]) => `<div class="sub-question-box mb-3"><p class="font-medium text-amber-400">${getBengaliLetter(key)} (${val.marks || '?'} নম্বর)</p><p class="mt-1"><strong>প্রশ্ন:</strong> ${val.question || ''}</p><p class="mt-1 text-green-400"><strong>উত্তর:</strong> ${val.answer || ''}</p></div>`).join('')}</div></div>`).join('')}</div></div>`;
    }
    
    // Mathematical Examples
    if (mathExamples.length > 0) {
        html += `<div class="mb-6"><h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-calculator mr-2"></i>গাণিতিক উদাহরণ</h3><div class="space-y-3">${mathExamples.map((ex, idx) => `<div class="border border-white/10 rounded-xl overflow-hidden"><button class="math-toggle w-full text-left p-3 font-medium hover:bg-white/5 transition flex justify-between items-center"><span>${ex.title || 'গাণিতিক সমস্যা'}</span><i class="fas fa-chevron-down text-gray-500"></i></button><div class="math-answer hidden p-3 pt-0 text-gray-400 border-t border-white/10"><p><strong>সমস্যা:</strong> ${ex.problem || ''}</p><p class="mt-2"><strong>সমাধান:</strong></p><p class="whitespace-pre-line">${ex.solution || ''}</p></div></div>`).join('')}</div></div>`;
    }
    
    // Chemical Reactions
    if (chemicalReactions.length > 0) {
        html += `<div class="mb-6"><h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-flask mr-2"></i>রাসায়নিক বিক্রিয়া</h3><div class="space-y-3">${chemicalReactions.map(cr => `<div class="glass rounded-xl p-3"><p class="font-mono text-amber-400">${cr.equation || ''}</p><p class="text-sm text-gray-400 mt-1">${cr.description || ''}</p></div>`).join('')}</div></div>`;
    }
    
    // Tables
    if (tables.length > 0) {
        html += `<div class="mb-6"><h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-table mr-2"></i>তুলনামূলক তথ্য</h3>${tables.map(table => `<div class="overflow-x-auto mb-4"><table class="w-full text-sm border border-white/10 rounded-xl"><thead><tr class="border-b border-white/10 bg-white/5">${(table.headers || []).map(h => `<th class="p-2 text-left">${h}</th>`).join('')}</tr></thead><tbody>${(table.rows || []).map(row => `<tr class="border-b border-white/5">${row.map(cell => `<td class="p-2">${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}</div>`;
    }
    
    // =============== FIXED MCQ SECTION WITH ROBUST MATCHING ===============
    if (examQuestions.length > 0) {
        let mcqState = {
            questions: [],
            userAnswers: [],
            examStarted: false,
            examEnded: false,
            timerInterval: null,
            timeRemaining: 0
        };
        
        const TIME_PER_QUESTION = 60;
        
        html += `
            <div class="mt-8 pt-6 border-t border-white/10">
                <div class="instruction-box rounded-xl p-4 mb-6">
                    <p class="text-sm text-blue-300"><i class="fas fa-info-circle mr-2"></i><strong>MCQ পরীক্ষার নিয়মাবলী:</strong></p>
                    <ul class="text-xs text-blue-200/80 mt-2 space-y-1 ml-4">
                        <li>✓ <strong>প্রথমে "পরীক্ষা শুরু করুন" বাটনে ক্লিক করতে হবে</strong></li>
                        <li>✓ পরীক্ষা শুরু করার আগে কোন উত্তর নির্বাচন করা যাবে না</li>
                        <li>✓ প্রতিটি প্রশ্নের জন্য <strong>মাত্র একটি উত্তর</strong> নির্বাচন করতে পারবেন</li>
                        <li>✓ উত্তর না দিলে সেটি <strong>ভুল হিসেবে গণ্য</strong> হবে</li>
                        <li>✓ মোট সময়: ${examQuestions.length} × ${TIME_PER_QUESTION} সেকেন্ড</li>
                    </ul>
                </div>
                
                <div class="exam-header flex flex-wrap justify-between items-center gap-4 mb-6 bg-gray-800/50 rounded-xl p-4">
                    <div>
                        <h3 class="text-xl font-bold text-amber-400"><i class="fas fa-check-double mr-2"></i>MCQ পরীক্ষা (বহুনির্বাচনী)</h3>
                        <p class="text-sm text-gray-400 mt-1">মোট প্রশ্ন: ${examQuestions.length} | প্রতিটি প্রশ্নের জন্য ১ নম্বর</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <div id="examTimer" class="text-lg font-mono font-bold text-amber-400 bg-black/50 px-4 py-2 rounded-full">⏱️ 0:00</div>
                        <button id="startExamBtn" class="start-exam-btn px-6 py-2 rounded-xl bg-gradient-to-r from-amber-600 to-orange-600 text-white font-bold shadow-lg transition hover:scale-105">
                            <i class="fas fa-play mr-2"></i> পরীক্ষা শুরু করুন
                        </button>
                    </div>
                </div>
                
                <div id="mcqExamPanel" style="display: none;">
                    <div id="mcqQuestionsContainer" class="space-y-5 mb-6 max-h-[600px] overflow-y-auto pr-2"></div>
                    <div class="flex gap-4 mt-6">
                        <button id="submitMcqBtn" class="px-6 py-3 rounded-xl bg-green-600 text-white font-bold shadow-lg hover:bg-green-700 transition">
                            <i class="fas fa-check-circle mr-2"></i> উত্তর জমা দিন ও ফলাফল দেখুন
                        </button>
                        <button id="resetMcqBtn" class="px-6 py-3 rounded-xl bg-gray-700 text-gray-300 font-bold hover:bg-gray-600 transition">
                            <i class="fas fa-undo-alt mr-2"></i> রিসেট করুন
                        </button>
                    </div>
                </div>
                
                <div id="mcqResultPanel" class="result-card rounded-xl p-5 mt-6 hidden"></div>
            </div>
        `;
        container.innerHTML = html;
        
        // --- Helper: Normalize Bengali text (trim, collapse spaces, Unicode NFC) ---
        function normalizeText(str) {
            if (typeof str !== 'string') return '';
            // Trim and normalize Unicode (NFC) to handle identical-looking Bengali characters
            return str.trim().normalize('NFC').replace(/\s+/g, ' ');
        }
        
        // --- Shuffle with robust text matching ---
        function shuffleQuestions() {
            mcqState.questions = examQuestions.map((originalQ, idx) => {
                const originalOptions = [...originalQ.o];
                let correctAnswerIndex;
                let correctAnswerText;
                
                // Determine correct answer (either stored as index or string)
                if (typeof originalQ.a === 'number') {
                    correctAnswerIndex = originalQ.a;
                    correctAnswerText = originalOptions[correctAnswerIndex];
                } else if (typeof originalQ.a === 'string') {
                    const normalizedAnswer = normalizeText(originalQ.a);
                    // Try to find the matching option by normalized text
                    correctAnswerIndex = originalOptions.findIndex(opt => normalizeText(opt) === normalizedAnswer);
                    if (correctAnswerIndex === -1) {
                        console.warn(`Question ${idx+1}: Answer "${originalQ.a}" not found in options! Falling back to index 0.`);
                        correctAnswerIndex = 0;
                        correctAnswerText = originalOptions[0];
                    } else {
                        correctAnswerText = originalOptions[correctAnswerIndex];
                    }
                } else {
                    console.error(`Question ${idx+1}: Invalid answer type. Defaulting to index 0.`);
                    correctAnswerIndex = 0;
                    correctAnswerText = originalOptions[0];
                }
                
                // Shuffle options
                const shuffledOptions = shuffleArray([...originalOptions]);
                // Find new index of the correct answer text (using normalized comparison)
                const normalizedCorrect = normalizeText(correctAnswerText);
                let newCorrectIndex = shuffledOptions.findIndex(opt => normalizeText(opt) === normalizedCorrect);
                
                if (newCorrectIndex === -1) {
                    console.error(`Question ${idx+1}: CRITICAL - Correct answer "${correctAnswerText}" not found after shuffle! Keeping original order.`);
                    // Fallback: use unshuffled options
                    return {
                        id: idx,
                        text: originalQ.q,
                        options: originalOptions,
                        correctIndex: correctAnswerIndex,
                        originalCorrectText: correctAnswerText
                    };
                }
                
                console.log(`Q${idx+1}: Correct = "${correctAnswerText}" (new index ${newCorrectIndex})`);
                return {
                    id: idx,
                    text: originalQ.q,
                    options: shuffledOptions,
                    correctIndex: newCorrectIndex,
                    originalCorrectText: correctAnswerText
                };
            });
            mcqState.userAnswers = new Array(mcqState.questions.length).fill(null);
        }
        
        // --- Render questions ---
        function renderQuestions() {
            const container = document.getElementById('mcqQuestionsContainer');
            if (!container) return;
            
            container.innerHTML = mcqState.questions.map((q, qIdx) => `
                <div class="glass rounded-xl p-4 border border-white/10" data-qidx="${qIdx}">
                    <p class="font-semibold mb-3 text-base"><span class="text-amber-400">${qIdx+1}.</span> ${q.text}</p>
                    <div class="grid gap-2 ml-2">
                        ${q.options.map((opt, optIdx) => `
                            <div class="mcq-option flex items-center gap-3 p-2 px-4 rounded-lg transition" data-qidx="${qIdx}" data-optidx="${optIdx}">
                                <span class="w-6 h-6 rounded-full border border-amber-500/50 flex items-center justify-center text-xs font-bold option-letter">${String.fromCharCode(65+optIdx)}</span>
                                <span>${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            
            // Attach click handlers
            document.querySelectorAll('.mcq-option').forEach(opt => {
                opt.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (mcqState.examEnded) {
                        showToast('⚠️ পরীক্ষা শেষ হয়ে গেছে! রিসেট করে আবার চেষ্টা করুন।', 'error');
                        return;
                    }
                    if (!mcqState.examStarted) {
                        showToast('⚠️ দয়া করে প্রথমে "পরীক্ষা শুরু করুন" বাটনে ক্লিক করুন!', 'error');
                        return;
                    }
                    
                    const qIdx = parseInt(opt.dataset.qidx);
                    const selectedIdx = parseInt(opt.dataset.optidx);
                    
                    // Toggle selection
                    if (mcqState.userAnswers[qIdx] === selectedIdx) {
                        mcqState.userAnswers[qIdx] = null;
                    } else {
                        mcqState.userAnswers[qIdx] = selectedIdx;
                    }
                    
                    // Update UI
                    const allOptions = document.querySelectorAll(`.mcq-option[data-qidx="${qIdx}"]`);
                    allOptions.forEach(option => {
                        const optIdx = parseInt(option.dataset.optidx);
                        const circleSpan = option.querySelector('.option-letter');
                        if (optIdx === mcqState.userAnswers[qIdx]) {
                            option.classList.add('selected');
                            if (circleSpan) {
                                circleSpan.classList.add('bg-amber-500', 'text-black');
                                circleSpan.classList.remove('border-amber-500/50');
                            }
                        } else {
                            option.classList.remove('selected');
                            if (circleSpan) {
                                circleSpan.classList.remove('bg-amber-500', 'text-black');
                                circleSpan.classList.add('border-amber-500/50');
                            }
                        }
                    });
                });
            });
        }
        
        // --- Timer functions ---
        function stopTimer() {
            if (mcqState.timerInterval) {
                clearInterval(mcqState.timerInterval);
                mcqState.timerInterval = null;
            }
        }
        
        function updateTimerDisplay() {
            const minutes = Math.floor(mcqState.timeRemaining / 60);
            const seconds = mcqState.timeRemaining % 60;
            const timerElement = document.getElementById('examTimer');
            if (timerElement) {
                timerElement.innerHTML = `<i class="fas fa-hourglass-half mr-1"></i> ${minutes}:${seconds.toString().padStart(2, '0')}`;
                if (mcqState.timeRemaining < 60) timerElement.classList.add('timer-warning');
                else timerElement.classList.remove('timer-warning');
            }
        }
        
        function startTimer() {
            stopTimer();
            const totalTime = mcqState.questions.length * TIME_PER_QUESTION;
            mcqState.timeRemaining = totalTime;
            updateTimerDisplay();
            mcqState.timerInterval = setInterval(() => {
                if (mcqState.timeRemaining > 0 && mcqState.examStarted && !mcqState.examEnded) {
                    mcqState.timeRemaining--;
                    updateTimerDisplay();
                    if (mcqState.timeRemaining === 0) {
                        stopTimer();
                        showToast('⏰ সময় শেষ! উত্তর জমা দেওয়া হচ্ছে...', 'error');
                        calculateAndShowResult();
                    }
                }
            }, 1000);
        }
        
        // --- Calculate score ---
        function calculateAndShowResult() {
            if (mcqState.examEnded) {
                showToast('ফলাফল ইতিমধ্যে দেখানো হয়েছে!', 'info');
                return;
            }
            stopTimer();
            mcqState.examEnded = true;
            
            const totalQuestions = mcqState.questions.length;
            let correctCount = 0;
            for (let i = 0; i < totalQuestions; i++) {
                const userAns = mcqState.userAnswers[i];
                const correctAns = mcqState.questions[i].correctIndex;
                if (userAns !== null && userAns === correctAns) correctCount++;
            }
            
            const score = `${correctCount}/${totalQuestions}`;
            const percentage = Math.round((correctCount / totalQuestions) * 100);
            const unansweredCount = mcqState.userAnswers.filter(a => a === null).length;
            
            const resultHtml = `
                <div class="text-center">
                    <i class="fas fa-chart-simple text-4xl text-amber-400 mb-3"></i>
                    <h4 class="text-2xl font-bold">আপনার ফলাফল</h4>
                    <div class="text-4xl font-bold text-amber-400 my-3">${score}</div>
                    <div class="w-full bg-gray-700 rounded-full h-3 max-w-xs mx-auto">
                        <div class="bg-gradient-to-r from-amber-500 to-orange-500 h-3 rounded-full" style="width: ${percentage}%"></div>
                    </div>
                    <p class="mt-3 text-gray-300">সঠিক উত্তর: ${correctCount} / মোট: ${totalQuestions}</p>
                    <p class="text-sm text-gray-400 mt-1">অনুত্তরিত প্রশ্ন: ${unansweredCount}টি (ভুল হিসেবে গণ্য হয়েছে)</p>
                    <div class="flex justify-center gap-3 mt-4">
                        <button id="reviewAnswersBtn" class="px-4 py-2 rounded-lg bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 transition">
                            <i class="fas fa-eye mr-1"></i> সঠিক উত্তর দেখুন
                        </button>
                        <button id="tryAgainBtn" class="px-4 py-2 rounded-lg bg-blue-500/20 text-blue-400 hover:bg-blue-500/30 transition">
                            <i class="fas fa-redo-alt mr-1"></i> আবার চেষ্টা করুন
                        </button>
                    </div>
                </div>
            `;
            
            const resultPanel = document.getElementById('mcqResultPanel');
            resultPanel.innerHTML = resultHtml;
            resultPanel.classList.remove('hidden');
            
            // Review answers: highlight correct (green) and user's wrong (red)
            document.getElementById('reviewAnswersBtn')?.addEventListener('click', () => {
                document.querySelectorAll('[data-qidx]').forEach((div, idx) => {
                    if (idx >= mcqState.questions.length) return;
                    const correctIdx = mcqState.questions[idx].correctIndex;
                    const userChoice = mcqState.userAnswers[idx];
                    const options = div.querySelectorAll('.mcq-option');
                    options.forEach((opt, optIdx) => {
                        opt.classList.remove('correct', 'wrong', 'selected');
                        const circleSpan = opt.querySelector('.option-letter');
                        if (optIdx === correctIdx) {
                            opt.classList.add('correct');
                            if (circleSpan) {
                                circleSpan.classList.add('bg-green-500', 'text-white');
                                circleSpan.classList.remove('bg-amber-500', 'text-black', 'border-amber-500/50');
                            }
                        }
                        if (userChoice !== null && optIdx === userChoice && userChoice !== correctIdx) {
                            opt.classList.add('wrong');
                            if (circleSpan) {
                                circleSpan.classList.add('bg-red-500', 'text-white');
                                circleSpan.classList.remove('bg-amber-500', 'text-black', 'border-amber-500/50');
                            }
                        }
                        if (userChoice !== null && optIdx === userChoice && userChoice === correctIdx) {
                            if (circleSpan) {
                                circleSpan.classList.add('bg-green-500', 'text-white');
                                circleSpan.classList.remove('bg-amber-500', 'text-black', 'border-amber-500/50');
                            }
                        }
                    });
                });
                showToast('সঠিক উত্তর সবুজ, আপনার ভুল উত্তর লাল রঙে হাইলাইট করা হয়েছে', 'success');
            });
            
            document.getElementById('tryAgainBtn')?.addEventListener('click', () => resetExam());
            showToast(`আপনার স্কোর: ${score} (${percentage}%)`, 'success');
        }
        
        function resetExam() {
            stopTimer();
            mcqState.examStarted = false;
            mcqState.examEnded = false;
            mcqState.userAnswers = new Array(mcqState.questions.length).fill(null);
            
            const examPanel = document.getElementById('mcqExamPanel');
            const startBtn = document.getElementById('startExamBtn');
            const resultPanel = document.getElementById('mcqResultPanel');
            const timerElement = document.getElementById('examTimer');
            
            if (examPanel) examPanel.style.display = 'none';
            if (resultPanel) {
                resultPanel.classList.add('hidden');
                resultPanel.innerHTML = '';
            }
            if (timerElement) timerElement.innerHTML = '⏱️ 0:00';
            if (startBtn) {
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                startBtn.innerHTML = '<i class="fas fa-play mr-2"></i> পরীক্ষা শুরু করুন';
            }
            if (mcqState.questions.length > 0) renderQuestions();
            showToast('পরীক্ষা রিসেট করা হয়েছে। "পরীক্ষা শুরু করুন" ক্লিক করুন।', 'info');
        }
        
        // --- Attach button events ---
        const startBtn = document.getElementById('startExamBtn');
        const examPanel = document.getElementById('mcqExamPanel');
        const submitBtn = document.getElementById('submitMcqBtn');
        const resetBtn = document.getElementById('resetMcqBtn');
        
        if (startBtn) {
            startBtn.onclick = () => {
                if (mcqState.examEnded) {
                    showToast('দয়া করে প্রথমে "রিসেট করুন" বাটনে ক্লিক করুন', 'error');
                    return;
                }
                shuffleQuestions();
                mcqState.examStarted = true;
                if (examPanel) examPanel.style.display = 'block';
                startBtn.disabled = true;
                startBtn.classList.add('opacity-50', 'cursor-not-allowed');
                startBtn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> পরীক্ষা শুরু হয়েছে';
                renderQuestions();
                startTimer();
                showToast('✅ পরীক্ষা শুরু হয়েছে! প্রতিটি প্রশ্নের উত্তর নির্বাচন করুন।', 'success');
            };
        }
        
        if (submitBtn) {
            submitBtn.onclick = () => {
                if (!mcqState.examStarted) {
                    showToast('⚠️ পরীক্ষা শুরু হয়নি! প্রথমে "পরীক্ষা শুরু করুন" ক্লিক করুন।', 'error');
                    return;
                }
                if (mcqState.examEnded) {
                    showToast('⚠️ ফলাফল ইতিমধ্যে দেখানো হয়েছে। নতুন পরীক্ষা দিতে "রিসেট করুন" ক্লিক করুন।', 'error');
                    return;
                }
                calculateAndShowResult();
            };
        }
        
        if (resetBtn) {
            resetBtn.onclick = () => resetExam();
        }
        
    } else {
        html += `<div class="text-center text-gray-400 py-8"><i class="fas fa-flask text-2xl mb-2"></i><p>এই টপিকের জন্য MCQ পরীক্ষা শীঘ্রই যুক্ত হবে।</p></div>`;
        container.innerHTML = html;
    }
    
    // Attach toggle handlers for accordions
    setTimeout(() => {
        document.querySelectorAll('.sq-toggle, .cq-toggle, .math-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const answer = btn.nextElementSibling;
                const icon = btn.querySelector('.fa-chevron-down');
                if (answer) {
                    answer.classList.toggle('hidden');
                    if (icon) icon.style.transform = answer.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
                }
            });
        });
    }, 100);
}
// ==================== END OF loadTopicContent REPLACEMENT ====================

// Make functions global
window.openChapter = openChapter;

function init() {
    renderChaptersGrid();
    updateOverallProgress();
    
    const backBtn = document.getElementById('backToChaptersBtn');
    if (backBtn) {
        backBtn.onclick = () => {
            document.getElementById('chaptersView').classList.remove('hidden');
            document.getElementById('chapterView').classList.add('hidden');
            currentChapterId = null;
        };
    }
    
    const markBtn = document.getElementById('markChapterCompleteBtn');
    if (markBtn) {
        markBtn.onclick = () => {
            if (currentChapterId) markChapterComplete(currentChapterId);
        };
    }
}

init();
