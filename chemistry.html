        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .float-animation { animation: float 4s ease-in-out infinite; }
        @keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }

        .floating-wa { position: fixed; bottom: 25px; right: 25px; z-index: 1000; background: #25D366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: all 0.2s ease; }

        .sub-question-box {

        }
    </style>

        <div class="glass-card rounded-2xl p-6 mb-8">

        <div class="flex flex-wrap gap-2 mb-6 border-b border-white/10 pb-3" id="topicsTabs"></div>

<script>
// ============================================
// CHEMISTRY APP - WORKING VERSION
// ============================================

// Chapter metadata (12 chapters)
const CHAPTERS_META = [
    { id: 1, title: "রসায়নের ধারণা", title_en: "The Concepts of Chemistry" },
    { id: 2, title: "পদার্থের অবস্থা", title_en: "States of Matter" },
    { id: 3, title: "পদার্থের গঠন", title_en: "Structure of Matter" },
    { id: 4, title: "পর্যায় সারণি", title_en: "Periodic Table" },
    { id: 5, title: "রাসায়নিক বন্ধন", title_en: "Chemical Bond" },
    { id: 6, title: "মোলের ধারণা ও রাসায়নিক গণনা", title_en: "Mole Concept" },
    { id: 7, title: "রাসায়নিক বিক্রিয়া", title_en: "Chemical Reactions" },
    { id: 8, title: "রসায়ন ও শক্তি", title_en: "Chemistry and Energy" },
    { id: 9, title: "এসিড-ক্ষারক সমতা", title_en: "Acid-Base Equilibrium" },
    { id: 10, title: "খনিজ সম্পদ: ধাতু-অধাতু", title_en: "Mineral Resources" },
    { id: 11, title: "খনিজ সম্পদ: জীবাশ্ম", title_en: "Fossil Fuels" },
    { id: 12, title: "আমাদের জীবনে রসায়ন", title_en: "Chemistry in Our Life" }
];

let completedChapters = JSON.parse(localStorage.getItem('chemistry_completed_chapters') || '[]');
let currentChapterId = null;
let currentTopicIndex = 0;
let chapterDataCache = {};

function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-lg text-sm z-50 animate-bounce ${
        type === 'success' ? 'bg-green-600' : 'bg-blue-600'
    } text-white`;
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

function getBengaliLetter(key) {
    const letters = { 'ka': 'ক', 'kha': 'খ', 'ga': 'গ', 'gha': 'ঘ' };
    return letters[key] || key.toUpperCase();
}

async function loadChapter(chapterId) {
    if (chapterDataCache[chapterId]) return chapterDataCache[chapterId];
    
    try {
        const response = await fetch(`data/chapter-${chapterId}.json`);
        if (!response.ok) throw new Error(`Chapter ${chapterId} not found`);
        const data = await response.json();
        chapterDataCache[chapterId] = data;
        return data;
    } catch (error) {
        return {
            chapter_title: CHAPTERS_META.find(c => c.id === chapterId)?.title || `অধ্যায় ${chapterId}`,
            topics: [{
                id: `${chapterId}.1`,
                title: `${CHAPTERS_META.find(c => c.id === chapterId)?.title || `অধ্যায় ${chapterId}`} - পরিচয়`,
                study: { summary: [`• ${CHAPTERS_META.find(c => c.id === chapterId)?.title} অধ্যায়ের বিস্তারিত কন্টেন্ট শীঘ্রই যুক্ত হবে।`] },
                exam: { questions: [] }
            }]
        };
    }
}

function updateOverallProgress() {
    const percent = Math.round((completedChapters.length / 12) * 100);
    document.getElementById('overallProgress').innerText = percent + '%';
    document.getElementById('mainProgressBar').style.width = percent + '%';
    document.getElementById('completedChaptersCount').innerText = completedChapters.length;
    document.getElementById('totalChaptersCount').innerText = 12;
    localStorage.setItem('chemistry_completed_chapters', JSON.stringify(completedChapters));
}

function markChapterComplete(chapterId) {
    if (!completedChapters.includes(chapterId)) {
        completedChapters.push(chapterId);
        updateOverallProgress();
        renderChaptersGrid();
        if (currentChapterId === chapterId) {
            const btn = document.getElementById('markChapterCompleteBtn');
            btn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> সম্পূর্ণ!';
            btn.classList.remove('bg-green-500/20', 'border-green-500/50', 'text-green-400');
            btn.classList.add('bg-gray-700', 'text-gray-400');
        }
        showToast('🎉 অধ্যায় সম্পূর্ণ চিহ্নিত করা হয়েছে!', 'success');
    }
}

function renderChaptersGrid() {
    const container = document.getElementById('chaptersGrid');
    container.innerHTML = CHAPTERS_META.map(ch => `
        <div class="glass-card rounded-2xl p-6 chapter-card" data-chapter-id="${ch.id}">
            <div class="flex justify-between items-start mb-3">
                <span class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full">অধ্যায় ${ch.id}</span>
                ${completedChapters.includes(ch.id) ? '<i class="fas fa-check-circle text-green-500 text-xl"></i>' : ''}
            </div>
            <h3 class="text-xl font-bold mb-1">${ch.title}</h3>
            <p class="text-gray-400 text-sm mb-4">${ch.title_en}</p>
            <button class="view-chapter-btn w-full px-4 py-2 rounded-lg bg-amber-500/20 text-amber-400 text-sm hover:bg-amber-500/30 transition" data-chapter-id="${ch.id}">
                <i class="fas fa-book-open mr-1"></i> পড়ুন
            </button>
        </div>
    `).join('');
    
    document.querySelectorAll('.view-chapter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openChapter(parseInt(btn.dataset.chapterId));
        });
    });
}

async function openChapter(chapterId) {
    currentChapterId = chapterId;
    const chapterData = await loadChapter(chapterId);
    
    document.getElementById('chaptersView').classList.add('hidden');
    document.getElementById('chapterView').classList.remove('hidden');
    document.getElementById('chapterNumber').innerText = chapterId;
    document.getElementById('chapterTitle').innerHTML = chapterData.chapter_title;
    
    const markBtn = document.getElementById('markChapterCompleteBtn');
    if (completedChapters.includes(chapterId)) {
        markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> সম্পূর্ণ!';
        markBtn.classList.remove('bg-green-500/20', 'border-green-500/50', 'text-green-400');
        markBtn.classList.add('bg-gray-700', 'text-gray-400');
    } else {
        markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> অধ্যায় সম্পূর্ণ চিহ্নিত করুন';
        markBtn.classList.remove('bg-gray-700', 'text-gray-400');
        markBtn.classList.add('bg-green-500/20', 'border-green-500/50', 'text-green-400');
    }
    
    const tabsContainer = document.getElementById('topicsTabs');
    tabsContainer.innerHTML = chapterData.topics.map((topic, idx) => `
        <button class="topic-tab px-4 py-2 rounded-lg text-sm transition ${idx === 0 ? 'bg-amber-500/20 text-amber-400' : 'text-gray-400 hover:text-amber-400'}" data-topic-index="${idx}">
            ${topic.id} ${topic.title.substring(0, 30)}${topic.title.length > 30 ? '...' : ''}
        </button>
    `).join('');
    
    currentTopicIndex = 0;
    await loadTopicContent(chapterId, 0, chapterData);
    
    document.querySelectorAll('.topic-tab').forEach(tab => {
        tab.addEventListener('click', async () => {
            const idx = parseInt(tab.dataset.topicIndex);
            currentTopicIndex = idx;
            await loadTopicContent(chapterId, idx, chapterData);
            document.querySelectorAll('.topic-tab').forEach(t => {
                t.classList.remove('bg-amber-500/20', 'text-amber-400');
                t.classList.add('text-gray-400');
            });
            tab.classList.add('bg-amber-500/20', 'text-amber-400');
        });
    });
}

async function loadTopicContent(chapterId, topicIndex, chapterData) {
    const topic = chapterData.topics[topicIndex];
    const container = document.getElementById('topicContent');
    
    const study = topic.study || {};
    const summary = study.summary || [`${topic.title} - বিস্তারিত কন্টেন্ট শীঘ্রই যুক্ত হবে।`];
    const shortQuestions = study.short_questions || [];
    const creativeQuestions = study.creative_questions || [];
    const mathExamples = study.mathematical_examples || [];
    const chemicalReactions = study.chemical_reactions || [];
    const tables = study.tables || [];
    const examQuestions = (topic.exam && topic.exam.questions) || [];
    
    let html = `
        <div>
            <div class="flex items-center gap-2 mb-4">
                <i class="fas fa-book text-amber-400"></i>
                <span class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full">টপিক ${topic.id}</span>
            </div>
            <h2 class="text-2xl font-bold mb-6">${topic.title}</h2>
            
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-align-left mr-2"></i>সারাংশ</h3>
                <div class="space-y-2 bg-black/20 rounded-xl p-4">
                    ${summary.map(s => `<p class="text-gray-300 leading-relaxed">${s}</p>`).join('')}
                </div>
            </div>
    `;
    
    // Short Questions
    if (shortQuestions.length > 0) {
        html += `
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-question-circle mr-2"></i>সংক্ষিপ্ত প্রশ্নোত্তর</h3>
                <div class="space-y-3">
                    ${shortQuestions.map((sq, idx) => `
                        <div class="border border-white/10 rounded-xl overflow-hidden">
                            <button class="sq-toggle w-full text-left p-3 font-medium hover:bg-white/5 transition flex justify-between items-center" data-idx="${idx}">
                                <span>${idx+1}. ${sq.q}</span>
                                <i class="fas fa-chevron-down text-gray-500"></i>
                            </button>
                            <div class="sq-answer hidden p-3 pt-0 text-gray-400 border-t border-white/10">
                                ${sq.a}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    // Creative Questions
    if (creativeQuestions.length > 0) {
        html += `
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-pencil-alt mr-2"></i>সৃজনশীল প্রশ্ন</h3>
                <div class="space-y-4">
                    ${creativeQuestions.map((cq, idx) => {
                        const paragraphText = cq.paragraph || '';
                        const subQuestions = cq.sub_questions || {};
                        return `
                            <div class="border border-white/10 rounded-xl overflow-hidden">
                                <button class="cq-toggle w-full text-left hover:bg-white/5 transition flex justify-between items-center p-3 font-medium" data-idx="${idx}">
                                    <span>${idx+1}. ${paragraphText.substring(0, 100)}${paragraphText.length > 100 ? '...' : ''}</span>
                                    <i class="fas fa-chevron-down text-gray-500"></i>
                                </button>
                                <div class="cq-answer hidden border-t border-white/10 p-3">
                                    <div class="creative-paragraph mb-3">
                                        <strong>উদ্দীপক:</strong> ${paragraphText}
                                    </div>
                                    ${Object.entries(subQuestions).map(([key, val]) => `
                                        <div class="sub-question-box mb-3">
                                            <p class="font-medium text-amber-400">${getBengaliLetter(key)} (${val.marks || '?'} নম্বর)</p>
                                            <p class="mt-1"><strong>প্রশ্ন:</strong> ${val.question || ''}</p>
                                            <p class="mt-1 text-green-400"><strong>উত্তর:</strong> ${val.answer || ''}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }
    
    // Mathematical Examples
    if (mathExamples.length > 0) {
        html += `
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-calculator mr-2"></i>গাণিতিক উদাহরণ</h3>
                <div class="space-y-3">
                    ${mathExamples.map((ex, idx) => `
                        <div class="border border-white/10 rounded-xl overflow-hidden">
                            <button class="math-toggle w-full text-left p-3 font-medium hover:bg-white/5 transition flex justify-between items-center" data-idx="${idx}">
                                <span>${ex.title || 'গাণিতিক সমস্যা'}</span>
                                <i class="fas fa-chevron-down text-gray-500"></i>
                            </button>
                            <div class="math-answer hidden p-3 pt-0 text-gray-400 border-t border-white/10">
                                <p><strong>সমস্যা:</strong> ${ex.problem || ''}</p>
                                <p class="mt-2"><strong>সমাধান:</strong></p>
                                <p class="whitespace-pre-line">${ex.solution || ''}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    // Chemical Reactions
    if (chemicalReactions.length > 0) {
        html += `
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-flask mr-2"></i>রাসায়নিক বিক্রিয়া</h3>
                <div class="space-y-3">
                    ${chemicalReactions.map((cr, idx) => `
                        <div class="glass rounded-xl p-3">
                            <p class="font-mono text-amber-400">${cr.equation || ''}</p>
                            <p class="text-sm text-gray-400 mt-1">${cr.description || ''}</p>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    // Tables
    if (tables.length > 0) {
        html += `
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-table mr-2"></i>তুলনামূলক তথ্য</h3>
                ${tables.map(table => `
                    <div class="overflow-x-auto mb-4">
                        <table class="w-full text-sm border border-white/10 rounded-xl">
                            <thead>
                                <tr class="border-b border-white/10 bg-white/5">
                                    ${(table.headers || []).map(h => `<th class="p-2 text-left">${h}</th>`).join('')}
                                 </tr>
                            </thead>
                            <tbody>
                                ${(table.rows || []).map(row => `
                                    <tr class="border-b border-white/5">
                                        ${row.map(cell => `<td class="p-2">${cell}</td>`).join('')}
                                     </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `).join('')}
            </div>
        `;
    }
    
    // MCQ Exam
    if (examQuestions.length > 0) {
        html += `
            <div class="mt-8 pt-6 border-t border-white/10">
                <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-question-circle mr-2"></i>MCQ পরীক্ষা</h3>
                <div id="mcqContainer" class="space-y-4">
                    ${examQuestions.map((mcq, idx) => `
                        <div class="glass rounded-xl p-4" data-mcq-idx="${idx}">
                            <p class="font-medium mb-3">${idx+1}. ${mcq.q}</p>
                            <div class="grid gap-2">
                                ${mcq.o.map((opt, optIdx) => `
                                    <div class="mcq-option glass border border-white/10 rounded-lg p-2 px-3 text-sm transition" data-opt-idx="${optIdx}" data-correct="${optIdx === mcq.a}">
                                        <span class="mr-2">${String.fromCharCode(65+optIdx)}.</span> ${opt}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
                <button class="check-mcq-btn mt-4 px-4 py-2 rounded-lg bg-amber-500/20 border border-amber-500/50 text-amber-400 text-sm hover:bg-amber-500/30 transition">
                    <i class="fas fa-check-double mr-1"></i> উত্তর যাচাই করুন
                </button>
            </div>
        `;
    }
    
    container.innerHTML = html;
    
    // Attach toggle events
    document.querySelectorAll('.sq-toggle, .cq-toggle, .math-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const answer = btn.nextElementSibling;
            const icon = btn.querySelector('.fa-chevron-down');
            answer.classList.toggle('hidden');
            icon.style.transform = answer.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        });
    });
    
    // Attach MCQ events
    setTimeout(() => {
        const mcqContainer = document.getElementById('mcqContainer');
        if (mcqContainer) {
            mcqContainer.querySelectorAll('.mcq-option').forEach(opt => {
                opt.onclick = function() {
                    this.closest('.glass').querySelectorAll('.mcq-option').forEach(o => o.classList.remove('selected', 'correct', 'wrong'));
                    this.classList.add('selected');
                };
            });
            const checkBtn = document.querySelector('.check-mcq-btn');
            if (checkBtn) {
                checkBtn.onclick = () => {
                    let score = 0, total = 0;
                    document.querySelectorAll('[data-mcq-idx]').forEach(questionDiv => {
                        const options = questionDiv.querySelectorAll('.mcq-option');
                        let selected = null, correctIdx = null;
                        options.forEach((opt, idx) => {
                            if (opt.classList.contains('selected')) selected = idx;
                            if (opt.getAttribute('data-correct') === 'true') correctIdx = idx;
                        });
                        if (selected !== null) total++;
                        if (selected === correctIdx) score++;
                        options.forEach((opt, idx) => {
                            opt.classList.remove('selected');
                            if (idx === correctIdx) opt.classList.add('correct');
                            if (selected === idx && selected !== correctIdx) opt.classList.add('wrong');
                        });
                    });
                    showToast(`📊 স্কোর: ${score}/${total}`, score === total ? 'success' : 'info');
                };
            }
        }
    }, 100);
}

function init() {
    renderChaptersGrid();
    updateOverallProgress();
    
    document.getElementById('backToChaptersBtn').addEventListener('click', () => {
        document.getElementById('chaptersView').classList.remove('hidden');
        document.getElementById('chapterView').classList.add('hidden');
        currentChapterId = null;
    });
    
    document.getElementById('markChapterCompleteBtn').addEventListener('click', () => {
        if (currentChapterId) markChapterComplete(currentChapterId);
    });
}

init();
</script>
</body>
</html>
