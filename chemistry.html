<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>রসায়ন সম্পূর্ণ সিলেবাস ২০২৬ | National Exam Center</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        body { background: linear-gradient(135deg, #0a0f1a 0%, #0c1320 100%); }
        
        .glass-card {
            background: rgba(18, 25, 45, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 158, 11, 0.2);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(245, 158, 11, 0.5);
            transform: translateY(-4px);
        }
        .gradient-text {
            background: linear-gradient(135deg, #fbbf24, #f59e0b, #ea580c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .progress-bar {
            background: linear-gradient(90deg, #f59e0b, #ea580c);
            transition: width 0.5s ease;
        }
        
        .mcq-option {
            transition: all 0.2s ease;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .mcq-option:hover { 
            background: rgba(245, 158, 11, 0.15); 
            border-color: #f59e0b;
        }
        .mcq-option.selected { 
            background: rgba(245, 158, 11, 0.3); 
            border-color: #f59e0b;
        }
        .mcq-option.correct { background: rgba(34, 197, 94, 0.25); border-color: #22c55e; }
        .mcq-option.wrong { background: rgba(239, 68, 68, 0.25); border-color: #ef4444; }
        
        .result-card {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(234, 88, 12, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        
        .floating-wa { 
            position: fixed; bottom: 25px; right: 25px; z-index: 1000; 
            background: #25D366; width: 60px; height: 60px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-size: 32px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: all 0.2s ease; 
        }
        .floating-wa:hover { transform: scale(1.1); }
        
        @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .float-animation { animation: float 4s ease-in-out infinite; }
        
        .instruction-box {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 12px;
            padding: 20px;
            margin: 20px;
        }
        
        .loading-spinner {
            border: 3px solid rgba(245, 158, 11, 0.3);
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-gray-200">

<nav class="fixed top-0 left-0 right-0 z-50 bg-black/50 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fas fa-flask text-2xl text-amber-500 float-animation"></i>
            <span class="font-bold text-xl gradient-text">রসায়ন সম্পূর্ণ সিলেবাস ২০২৬</span>
        </div>
        <div class="flex gap-4">
            <a href="/" class="px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-400 text-sm hover:bg-amber-500/30 transition">
                <i class="fas fa-home mr-1"></i> হোম
            </a>
        </div>
    </div>
</nav>

<div class="pt-20 max-w-7xl mx-auto px-4 py-8">
    <!-- Debug Panel (only shows if there's an error) -->
    <div id="debugPanel" class="hidden error-message mb-4"></div>
    
    <!-- Chapters View -->
    <div id="chaptersView">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold gradient-text mb-4">রসায়ন সম্পূর্ণ সিলেবাস ২০২৬</h1>
            <p class="text-gray-400 max-w-2xl mx-auto">NCTB ২০২৬ সিলেবাস অনুযায়ী নবম ও দশম শ্রেণির রসায়নের ১২টি অধ্যায়</p>
        </div>
        
        <div class="glass-card rounded-2xl p-6 mb-8">
            <h3 class="text-lg font-semibold mb-3"><i class="fas fa-chart-line text-amber-400 mr-2"></i>আপনার পড়ার অগ্রগতি</h3>
            <div class="h-3 bg-gray-800 rounded-full overflow-hidden">
                <div id="mainProgressBar" class="h-full progress-bar rounded-full" style="width: 0%"></div>
            </div>
            <p class="text-sm text-gray-400 mt-2"><span id="completedChaptersCount">0</span>/12 অধ্যায় সম্পূর্ণ</p>
        </div>
        
        <div id="chaptersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="loading-spinner"></div>
        </div>
    </div>
    
    <!-- Chapter View (hidden initially) -->
    <div id="chapterView" class="hidden">
        <div class="mb-6">
            <button id="backToChaptersBtn" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 transition">
                <i class="fas fa-arrow-left"></i> সব অধ্যায়ে ফিরুন
            </button>
        </div>
        
        <div class="glass-card rounded-2xl p-6 mb-8">
            <div class="flex justify-between items-start flex-wrap gap-3">
                <div>
                    <span class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full">অধ্যায় <span id="chapterNumber"></span></span>
                    <h1 class="text-2xl md:text-3xl font-bold mt-2" id="chapterTitle"></h1>
                </div>
                <button id="markChapterCompleteBtn" class="px-4 py-2 rounded-lg bg-green-500/20 border border-green-500/50 text-green-400 text-sm hover:bg-green-500/30 transition">
                    <i class="fas fa-check-circle mr-1"></i> অধ্যায় সম্পূর্ণ চিহ্নিত করুন
                </button>
            </div>
        </div>
        
        <div id="topicContent" class="glass-card rounded-2xl p-6">
            <div class="loading-spinner"></div>
        </div>
    </div>
</div>

<a href="https://wa.me/8801602105447" class="floating-wa" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
// ============================================
// DEBUGGED VERSION - WILL SHOW ERRORS
// ============================================

// Show debug message
function showDebug(message, isError = true) {
    const debugPanel = document.getElementById('debugPanel');
    if (debugPanel) {
        debugPanel.innerHTML = `
            <div class="flex items-start gap-3">
                <i class="fas ${isError ? 'fa-exclamation-triangle text-red-400' : 'fa-info-circle text-blue-400'} text-xl"></i>
                <div class="flex-1">
                    <p class="font-semibold ${isError ? 'text-red-400' : 'text-blue-400'}">${isError ? 'Error' : 'Info'}</p>
                    <p class="text-sm text-gray-300 mt-1">${message}</p>
                    <p class="text-xs text-gray-400 mt-2">Check console for details (F12)</p>
                </div>
            </div>
        `;
        debugPanel.classList.remove('hidden');
    }
    console.log(isError ? 'ERROR:' : 'INFO:', message);
}

// Chapter metadata
const CHAPTERS_META = [
    { id: 1, title: "রসায়নের ধারণা", title_en: "The Concepts of Chemistry" },
    { id: 2, title: "পদার্থের অবস্থা", title_en: "States of Matter" },
    { id: 3, title: "পদার্থের গঠন", title_en: "Structure of Matter" },
    { id: 4, title: "পর্যায় সারণি", title_en: "Periodic Table" },
    { id: 5, title: "রাসায়নিক বন্ধন", title_en: "Chemical Bond" },
    { id: 6, title: "মোলের ধারণা ও রাসায়নিক গণনা", title_en: "Mole Concept" },
    { id: 7, title: "রাসায়নিক বিক্রিয়া", title_en: "Chemical Reactions" },
    { id: 8, title: "রসায়ন ও শক্তি", title_en: "Chemistry and Energy" },
    { id: 9, title: "এসিড-ক্ষারক সমতা", title_en: "Acid-Base Equilibrium" },
    { id: 10, title: "খনিজ সম্পদ: ধাতু-অধাতু", title_en: "Mineral Resources" },
    { id: 11, title: "খনিজ সম্পদ: জীবাশ্ম", title_en: "Fossil Fuels" },
    { id: 12, title: "আমাদের জীবনে রসায়ন", title_en: "Chemistry in Our Life" }
];

let completedChapters = [];
let currentChapterData = null;
let currentChapterId = null;

// Load saved progress
try {
    const stored = localStorage.getItem('chemistry_completed_chapters');
    if (stored) {
        completedChapters = JSON.parse(stored);
        console.log('Loaded completed chapters:', completedChapters);
    }
} catch(e) {
    console.error('Failed to load saved progress:', e);
    showDebug('Failed to load saved progress: ' + e.message);
}

function updateOverallProgress() {
    const percent = Math.round((completedChapters.length / 12) * 100);
    const progressBar = document.getElementById('mainProgressBar');
    const completedSpan = document.getElementById('completedChaptersCount');
    
    if (progressBar) progressBar.style.width = percent + '%';
    if (completedSpan) completedSpan.innerText = completedChapters.length;
    
    localStorage.setItem('chemistry_completed_chapters', JSON.stringify(completedChapters));
    console.log(`Progress updated: ${completedChapters.length}/12 (${percent}%)`);
}

async function loadChapterData(chapterId) {
    const url = `data/chapter-${chapterId}.json`;
    console.log(`Attempting to load: ${url}`);
    
    try {
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        console.log(`Successfully loaded chapter ${chapterId}:`, data);
        return data;
        
    } catch (error) {
        console.error(`Failed to load chapter ${chapterId}:`, error);
        showDebug(`Failed to load chapter ${chapterId}: ${error.message}\n\nPlease check that data/chapter-${chapterId}.json exists and is valid JSON.`);
        
        // Return fallback data
        return {
            chapter_title: CHAPTERS_META.find(c => c.id === chapterId)?.title || `অধ্যায় ${chapterId}`,
            topics: [{
                id: `${chapterId}.1`,
                title: `${CHAPTERS_META.find(c => c.id === chapterId)?.title || `অধ্যায় ${chapterId}`} - সম্পূর্ণ প্রস্তুতি`,
                study: {
                    summary: [`${CHAPTERS_META.find(c => c.id === chapterId)?.title} অধ্যায়ের বিস্তারিত ব্যাখ্যা।`, '• এনসিটিবি ২০২৬ সিলেবাস অনুযায়ী।']
                },
                exam: { questions: [
                    { q: "নমুনা প্রশ্ন ১: এই অধ্যায়ের মূল বিষয় কী?", o: ["বিকল্প ১", "বিকল্প ২", "বিকল্প ৩", "বিকল্প ৪"], a: 0 },
                    { q: "নমুনা প্রশ্ন ২: সঠিক উত্তর নির্বাচন করুন?", o: ["উত্তর ১", "উত্তর ২", "উত্তর ৩", "উত্তর ৪"], a: 1 }
                ] }
            }]
        };
    }
}

async function renderChaptersGrid() {
    const container = document.getElementById('chaptersGrid');
    if (!container) {
        console.error('Chapters grid container not found!');
        return;
    }
    
    console.log('Rendering chapters grid...');
    
    container.innerHTML = CHAPTERS_META.map(ch => `
        <div class="glass-card rounded-2xl p-6 chapter-card">
            <div class="flex justify-between items-start mb-3">
                <span class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full">অধ্যায় ${ch.id}</span>
                ${completedChapters.includes(ch.id) ? '<i class="fas fa-check-circle text-green-500 text-xl"></i>' : ''}
            </div>
            <h3 class="text-xl font-bold mb-1">${ch.title}</h3>
            <p class="text-gray-400 text-sm mb-4">${ch.title_en}</p>
            <button onclick="openChapter(${ch.id})" class="w-full px-4 py-2 rounded-lg bg-amber-500/20 text-amber-400 text-sm hover:bg-amber-500/30 transition">
                <i class="fas fa-book-open mr-1"></i> পড়ুন ও পরীক্ষা দিন
            </button>
        </div>
    `).join('');
    
    console.log('Chapters grid rendered successfully');
}

async function openChapter(chapterId) {
    console.log(`Opening chapter ${chapterId}...`);
    currentChapterId = chapterId;
    
    // Show loading
    document.getElementById('chaptersView').classList.add('hidden');
    document.getElementById('chapterView').classList.remove('hidden');
    document.getElementById('topicContent').innerHTML = '<div class="loading-spinner"></div>';
    
    // Load chapter data
    currentChapterData = await loadChapterData(chapterId);
    
    if (!currentChapterData) {
        document.getElementById('topicContent').innerHTML = `
            <div class="error-message text-center">
                <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-3"></i>
                <p class="text-red-400">অধ্যায়ের তথ্য লোড করতে ব্যর্থ হয়েছে</p>
                <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-amber-500 rounded-lg">পুনরায় চেষ্টা করুন</button>
            </div>
        `;
        return;
    }
    
    // Update UI
    document.getElementById('chapterNumber').innerText = chapterId;
    document.getElementById('chapterTitle').innerHTML = currentChapterData.chapter_title;
    
    // Update complete button
    const markBtn = document.getElementById('markChapterCompleteBtn');
    if (completedChapters.includes(chapterId)) {
        markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> সম্পূর্ণ!';
        markBtn.classList.remove('bg-green-500/20', 'border-green-500/50', 'text-green-400');
        markBtn.classList.add('bg-gray-700', 'text-gray-400');
    } else {
        markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> অধ্যায় সম্পূর্ণ চিহ্নিত করুন';
        markBtn.classList.remove('bg-gray-700', 'text-gray-400');
        markBtn.classList.add('bg-green-500/20', 'border-green-500/50', 'text-green-400');
    }
    
    // Load first topic
    await loadTopicContent(0);
}

async function loadTopicContent(topicIndex) {
    if (!currentChapterData || !currentChapterData.topics || currentChapterData.topics.length === 0) {
        document.getElementById('topicContent').innerHTML = '<div class="error-message">কোন টপিক পাওয়া যায়নি</div>';
        return;
    }
    
    const topic = currentChapterData.topics[topicIndex];
    const study = topic.study || {};
    const summary = study.summary || ['কোন সারাংশ পাওয়া যায়নি।'];
    const examQuestions = (topic.exam && topic.exam.questions) ? [...topic.exam.questions] : [];
    
    let html = `
        <div>
            <div class="flex items-center gap-2 mb-4">
                <i class="fas fa-book text-amber-400"></i>
                <span class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full">টপিক ${topic.id}</span>
            </div>
            <h2 class="text-2xl font-bold mb-6">${topic.title}</h2>
            
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-align-left mr-2"></i>সারাংশ</h3>
                <div class="space-y-2 bg-black/20 rounded-xl p-4">
                    ${summary.map(s => `<p class="text-gray-300 leading-relaxed">${s}</p>`).join('')}
                </div>
            </div>
    `;
    
    // Simplified MCQ section for testing
    if (examQuestions.length > 0) {
        html += `
            <div class="mt-8 pt-6 border-t border-white/10">
                <h3 class="text-xl font-bold text-amber-400 mb-4"><i class="fas fa-check-double mr-2"></i>MCQ পরীক্ষা</h3>
                <div id="mcqContainer"></div>
            </div>
        `;
        container.innerHTML = html;
        
        // Render MCQs
        const mcqContainer = document.getElementById('mcqContainer');
        if (mcqContainer) {
            mcqContainer.innerHTML = examQuestions.map((q, idx) => `
                <div class="glass-card rounded-xl p-4 mb-4">
                    <p class="font-semibold mb-3"><span class="text-amber-400">${idx+1}.</span> ${q.q}</p>
                    <div class="grid gap-2 ml-4">
                        ${q.o.map((opt, optIdx) => `
                            <label class="flex items-center gap-3 p-2 rounded-lg cursor-pointer hover:bg-white/5">
                                <input type="radio" name="q${idx}" value="${optIdx}" class="w-4 h-4 text-amber-500">
                                <span>${String.fromCharCode(65+optIdx)}. ${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
    } else {
        html += `<p class="text-gray-400 text-center py-8">এই টপিকের জন্য MCQ পরীক্ষা নেই।</p>`;
        container.innerHTML = html;
    }
    
    console.log(`Topic ${topicIndex} loaded successfully`);
}

// Make functions global
window.openChapter = openChapter;

// Initialize page
async function init() {
    console.log('Initializing Chemistry page...');
    
    try {
        await renderChaptersGrid();
        updateOverallProgress();
        console.log('Initialization complete');
    } catch (error) {
        console.error('Initialization failed:', error);
        showDebug('Page initialization failed: ' + error.message);
    }
    
    // Setup back button
    const backBtn = document.getElementById('backToChaptersBtn');
    if (backBtn) {
        backBtn.onclick = () => {
            document.getElementById('chaptersView').classList.remove('hidden');
            document.getElementById('chapterView').classList.add('hidden');
            currentChapterId = null;
            currentChapterData = null;
        };
    }
    
    // Setup mark complete button
    const markBtn = document.getElementById('markChapterCompleteBtn');
    if (markBtn) {
        markBtn.onclick = () => {
            if (currentChapterId && !completedChapters.includes(currentChapterId)) {
                completedChapters.push(currentChapterId);
                updateOverallProgress();
                renderChaptersGrid();
                markBtn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> সম্পূর্ণ!';
                markBtn.classList.remove('bg-green-500/20', 'border-green-500/50', 'text-green-400');
                markBtn.classList.add('bg-gray-700', 'text-gray-400');
                showDebug(`অধ্যায় ${currentChapterId} সম্পূর্ণ চিহ্নিত করা হয়েছে!`, false);
            }
        };
    }
}

// Start the app when page loads
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
