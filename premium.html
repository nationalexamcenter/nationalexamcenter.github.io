// State Management
let currentTopicIndex = 0;
let readingMode = false;
let completedTopics = JSON.parse(localStorage.getItem('chemistry_completed_topics') || '[]');

// Update progress
function updateProgress() {
    const total = chapterData.topics.length;
    const completed = completedTopics.length;
    const percent = Math.round((completed / total) * 100);
    document.getElementById('progressPercent').innerText = percent + '%';
    document.getElementById('chapterProgressText').innerText = percent + '%';
    document.getElementById('chapterProgressBar').style.width = percent + '%';
    
    // Save to localStorage
    localStorage.setItem('chemistry_chapter1_progress', percent);
}

// Mark topic as complete
function markCurrentTopicComplete() {
    const topicId = chapterData.topics[currentTopicIndex].id;
    if (!completedTopics.includes(topicId)) {
        completedTopics.push(topicId);
        localStorage.setItem('chemistry_completed_topics', JSON.stringify(completedTopics));
        updateProgress();
        loadContent(currentTopicIndex);
        showToast('✅ টপিক সম্পূর্ণ চিহ্নিত করা হয়েছে!', 'success');
    } else {
        showToast('ℹ️ এই টপিক ইতিমধ্যে সম্পূর্ণ চিহ্নিত', 'info');
    }
}

// Mark entire chapter complete
function markChapterComplete() {
    const allTopicIds = chapterData.topics.map(t => t.id);
    const newCompleted = [...new Set([...completedTopics, ...allTopicIds])];
    completedTopics.length = 0;
    completedTopics.push(...newCompleted);
    localStorage.setItem('chemistry_completed_topics', JSON.stringify(completedTopics));
    updateProgress();
    loadContent(currentTopicIndex);
    showToast('🎉 পুরো অধ্যায় সম্পূর্ণ চিহ্নিত হয়েছে!', 'success');
}

// Reset progress
function resetProgress() {
    completedTopics = [];
    localStorage.setItem('chemistry_completed_topics', JSON.stringify(completedTopics));
    localStorage.removeItem('chemistry_chapter1_progress');
    updateProgress();
    loadContent(currentTopicIndex);
    showToast('🔄 অগ্রগতি রিসেট করা হয়েছে', 'warning');
}

// Toast notification
function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-lg text-sm z-50 animate-bounce ${
        type === 'success' ? 'bg-green-600' : type === 'warning' ? 'bg-orange-600' : 'bg-blue-600'
    } text-white`;
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

// Load content for current topic
function loadContent(index) {
    const topic = chapterData.topics[index];
    const isCompleted = completedTopics.includes(topic.id);
    
    const container = document.getElementById('contentContainer');
    container.innerHTML = `
        <div class="glass-card rounded-2xl p-6">
            <div class="flex justify-between items-start flex-wrap gap-3 mb-4">
                <div>
                    <span class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-full">টপিক ${topic.id}</span>
                    <h2 class="text-2xl font-bold mt-2">${topic.title}</h2>
                </div>
                ${isCompleted ? '<i class="fas fa-check-circle text-green-500 text-2xl"></i>' : ''}
            </div>
            
            <!-- Summary Section -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-align-left mr-2"></i>সারাংশ</h3>
                <div class="space-y-2 ${readingMode ? 'reading-mode' : ''}">
                    ${topic.content.summary.map(s => `<p class="text-gray-300 leading-relaxed">${s}</p>`).join('')}
                </div>
            </div>
            
            ${topic.content.keyPoints ? `
            <div class="mb-6 bg-amber-500/5 rounded-xl p-4 border border-amber-500/20">
                <h3 class="text-sm font-semibold text-amber-400 mb-2"><i class="fas fa-lightbulb mr-1"></i>মূল বিষয়সমূহ</h3>
                <div class="flex flex-wrap gap-2">
                    ${topic.content.keyPoints.map(kp => `<span class="text-xs bg-gray-800 px-2 py-1 rounded-full">${kp}</span>`).join('')}
                </div>
            </div>
            ` : ''}
            
            ${topic.content.examples ? `
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-list mr-2"></i>উদাহরণ</h3>
                <div class="grid gap-2">
                    ${topic.content.examples.map(ex => `<div class="glass p-3 rounded-xl">${ex}</div>`).join('')}
                </div>
            </div>
            ` : ''}
            
            ${topic.content.equations ? `
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-square-root-alt mr-2"></i>গুরুত্বপূর্ণ সমীকরণ</h3>
                <div class="bg-black/30 rounded-xl p-4 font-mono">
                    ${topic.content.equations.map(eq => `<div class="mb-2">${eq}</div>`).join('')}
                </div>
            </div>
            ` : ''}
            
            ${topic.content.example ? `
            <div class="mb-6 bg-gradient-to-r from-blue-500/10 to-purple-500/10 rounded-xl p-4 border border-blue-500/20">
                <h3 class="font-semibold text-blue-400 mb-2"><i class="fas fa-flask mr-1"></i>${topic.content.example.title}</h3>
                <p class="text-sm text-gray-300"><strong>পদ্ধতি:</strong> ${topic.content.example.procedure}</p>
                <p class="text-sm text-gray-300 mt-1"><strong>ফলাফল:</strong> ${topic.content.example.result}</p>
                <p class="text-sm text-amber-400 mt-2"><strong>সিদ্ধান্ত:</strong> ${topic.content.example.conclusion}</p>
            </div>
            ` : ''}
            
            ${topic.content.hazardSymbols ? `
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-amber-400 mb-3"><i class="fas fa-exclamation-triangle mr-2"></i>বিপদ সংকেত</h3>
                <div class="flex flex-wrap gap-2">
                    ${topic.content.hazardSymbols.map(h => `<span class="text-sm glass px-3 py-1 rounded-full">${h}</span>`).join('')}
                </div>
            </div>
            ` : ''}
            
            <!-- MCQ Section -->
            ${topic.exam?.mcq ? `
            <div class="mt-8 pt-6 border-t border-white/10">
                <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-question-circle mr-2"></i>MCQ পরীক্ষা</h3>
                <div id="mcqContainer_${topic.id}" class="space-y-4">
                    ${topic.exam.mcq.map((mcq, idx) => `
                        <div class="glass rounded-xl p-4" data-mcq-idx="${idx}">
                            <p class="font-medium mb-3">${idx+1}. ${mcq.q}</p>
                            <div class="grid gap-2">
                                ${mcq.o.map((opt, optIdx) => `
                                    <div class="mcq-option glass border border-white/10 rounded-lg p-2 px-3 text-sm transition" data-opt-idx="${optIdx}" data-correct="${optIdx === mcq.a}">
                                        <span class="mr-2">${String.fromCharCode(65+optIdx)}.</span> ${opt}
                                    </div>
                                `).join('')}
                            </div>
                            <div class="mcq-feedback mt-2 text-xs hidden"></div>
                        </div>
                    `).join('')}
                </div>
                <button class="check-mcq-btn mt-4 px-4 py-2 rounded-lg bg-amber-500/20 border border-amber-500/50 text-amber-400 text-sm hover:bg-amber-500/30 transition">
                    <i class="fas fa-check-double mr-1"></i> উত্তর যাচাই করুন
                </button>
            </div>
            ` : ''}
        </div>
    `;
    
    // Attach MCQ event listeners
    setTimeout(() => attachMCQEvents(topic.id), 100);
    
    // Update sidebar active state
    updateSidebarActive(index);
}

function attachMCQEvents(topicId) {
    const container = document.getElementById(`mcqContainer_${topicId}`);
    if (!container) return;
    
    // Option selection
    container.querySelectorAll('.mcq-option').forEach(opt => {
        opt.removeEventListener('click', opt._listener);
        opt._listener = () => {
            // Remove selected class from siblings
            const parent = opt.closest('.glass');
            parent.querySelectorAll('.mcq-option').forEach(o => {
                o.classList.remove('selected', 'correct', 'wrong');
            });
            opt.classList.add('selected');
        };
        opt.addEventListener('click', opt._listener);
    });
    
    // Check answers button
    const checkBtn = container.closest('.glass-card')?.querySelector('.check-mcq-btn');
    if (checkBtn && !checkBtn._listener) {
        checkBtn._listener = () => {
            let score = 0;
            let total = 0;
            container.querySelectorAll('.glass').forEach(questionDiv => {
                const options = questionDiv.querySelectorAll('.mcq-option');
                let selected = null;
                let correctIdx = null;
                options.forEach((opt, idx) => {
                    if (opt.classList.contains('selected')) selected = idx;
                    if (opt.getAttribute('data-correct') === 'true') correctIdx = idx;
                });
                if (selected !== null) total++;
                if (selected === correctIdx) score++;
                
                // Show correct/wrong visual feedback
                options.forEach((opt, idx) => {
                    opt.classList.remove('selected');
                    if (idx === correctIdx) opt.classList.add('correct');
                    if (selected === idx && selected !== correctIdx) opt.classList.add('wrong');
                });
            });
            showToast(`📊 স্কোর: ${score}/${total}`, score === total ? 'success' : 'info');
        };
        checkBtn.addEventListener('click', checkBtn._listener);
    }
}

function updateSidebarActive(index) {
    const sidebarLinks = document.querySelectorAll('.sidebar-link');
    sidebarLinks.forEach((link, i) => {
        if (i === index) link.classList.add('active');
        else link.classList.remove('active');
    });
}

function loadSidebar() {
    const sidebar = document.getElementById('topicSidebar');
    sidebar.innerHTML = chapterData.topics.map((topic, idx) => `
        <a href="#" class="sidebar-link flex items-center justify-between p-3 rounded-xl transition border-l-2 border-transparent hover:bg-white/5 ${completedTopics.includes(topic.id) ? 'text-green-400' : ''}" data-index="${idx}">
            <div class="flex items-center gap-2">
                <i class="fas fa-${completedTopics.includes(topic.id) ? 'check-circle text-green-500' : 'circle'} text-xs"></i>
                <span class="text-sm">${topic.id} ${topic.title.substring(0, 35)}${topic.title.length > 35 ? '...' : ''}</span>
            </div>
            ${completedTopics.includes(topic.id) ? '<i class="fas fa-check-circle text-green-500 text-xs"></i>' : ''}
        </a>
    `).join('');
    
    document.querySelectorAll('.sidebar-link').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            currentTopicIndex = parseInt(link.dataset.index);
            loadContent(currentTopicIndex);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });
}

// Toggle reading mode
function toggleReadingMode() {
    readingMode = !readingMode;
    const btn = document.getElementById('readingModeBtn');
    if (readingMode) {
        btn.innerHTML = '<i class="fas fa-sun mr-1"></i> লাইট';
        document.body.classList.add('reading-mode-active');
        showToast('📖 পড়ার মোড সক্রিয়', 'info');
    } else {
        btn.innerHTML = '<i class="fas fa-moon mr-1"></i> ডার্ক';
        document.body.classList.remove('reading-mode-active');
    }
    loadContent(currentTopicIndex);
}

// Initialize
function init() {
    loadSidebar();
    loadContent(0);
    updateProgress();
    
    document.getElementById('markCompleteBtn').addEventListener('click', markCurrentTopicComplete);
    document.getElementById('resetProgressBtn').addEventListener('click', resetProgress);
    document.getElementById('readingModeBtn').addEventListener('click', toggleReadingMode);
    document.getElementById('mobileMarkCompleteBtn')?.addEventListener('click', markCurrentTopicComplete);
    
    // Next topic button
    document.getElementById('nextTopicBtn').addEventListener('click', () => {
        if (currentTopicIndex < chapterData.topics.length - 1) {
            currentTopicIndex++;
            loadContent(currentTopicIndex);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            showToast('🎉 আপনি অধ্যায় শেষ করেছেন!', 'success');
            markChapterComplete();
        }
    });
}

init();
</script>
